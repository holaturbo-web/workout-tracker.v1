<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>OCELOTL//CORP</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ocelotl">

<style>
:root{
  --bg:#16181d; --card:#22262e; --card2:#2b3039; --line:#353b46; --text:#f2f4f7; --muted:#8b93a1;
  --blue:#3fa0ff; --green:#2fca6c; --red:#ff5a5f; --gold:#e6b93c;
  --bench:#e6b93c; --hinge:#4f9dff; --squat:#3fcf7a; --ohp:#ff9a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom)) 0;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 24px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.3px;text-transform:uppercase}
h2{font-size:18px;margin:18px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{background:var(--card2);padding:10px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--green);color:#06210f}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:#3a2226;color:#ff8d91}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.chip{background:var(--card2);padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:12px;margin:12px 0}
.ex-title{font-weight:700;font-size:17px;color:var(--blue);display:flex;align-items:center;gap:8px}
.ex-title .dot{width:10px;height:10px;border-radius:50%;flex:none}
.ex-note{font-size:13px;color:var(--muted);margin:4px 0 8px;line-height:1.35}
.ex-target{font-size:13px;color:var(--gold);margin:2px 0 6px;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-size:13px;color:var(--text);font-weight:700;text-align:center;padding:0 2px}
th:first-child,td:first-child{width:38px}
td{text-align:center;padding:0 2px}
.setno{background:var(--card2);border-radius:8px;height:38px;line-height:38px;font-weight:700}
.prev{color:var(--muted);font-size:13px;white-space:nowrap}
.cell{width:100%;height:38px;border-radius:8px;border:0;background:#14171c;text-align:center;font-weight:700;font-size:17px}
.cell::placeholder{color:#5d6573;font-weight:600}
.chk{width:42px;height:38px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto}
.chk svg{width:20px;height:20px;stroke:#9aa3b1}
tr.done .chk{background:var(--green)} tr.done .chk svg{stroke:#06210f}
tr.done .cell,tr.done .setno{background:#1f3a2a}
.addset{width:100%;background:var(--card2);border-radius:8px;padding:8px;font-weight:600;font-size:14px;margin-top:2px}
.warm{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#1b1e24;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.tab.on{color:var(--blue)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--blue);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:536px;margin:0 auto}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.over{background:var(--green);color:#06210f}
.sess{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);margin:8px 0}
.sess .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.sess.done .st{background:var(--green);border-color:var(--green);color:#06210f}
.sess.prog .st{border-color:var(--gold);color:var(--gold)}
.sess.next{outline:2px solid var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:42px;border-radius:10px;border:0;background:#14171c;padding:0 10px;font-size:17px;font-weight:700}
.stat{background:var(--card2);border-radius:10px;padding:10px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
select{background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit;width:100%}
.banner{background:#2a2f1e;border:1px solid #5b6130;color:#e9e3a5;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90%}
textarea{width:100%;height:140px;background:#14171c;color:var(--text);border:0;border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,monospace}
svg.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.setno.w{color:#f0a35a;background:#3a2d22}
.setno.prset{background:var(--gold);color:#2a2000;font-size:13px}
tr.wu .cell{font-size:15px;color:var(--muted)}
.prb{display:inline-block;background:var(--gold);color:#2a2000;font-size:10px;font-weight:800;border-radius:5px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.ex-title{cursor:pointer}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.mini{background:var(--card2);color:var(--muted);font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px}
.mynote{background:#1d2a3a;border-left:3px solid var(--blue);border-radius:6px;padding:6px 8px;font-size:13px;margin:4px 0 6px;white-space:pre-wrap}
.sheet-bg{position:fixed;inset:0;background:#0009;z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.plates{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.plate{border-radius:6px;color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;width:34px}
.feel{display:flex;gap:6px}
.feel button{flex:1;background:var(--card2);border-radius:10px;padding:10px 0;font-weight:700}
.feel button.on{background:var(--blue);color:#fff}
.timer .t{font-size:34px}
.timer{padding:14px 16px}
.nextbar{position:fixed;left:0;right:0;z-index:70;display:none;justify-content:flex-end;gap:8px;padding:6px 10px;background:#2b3039;border-top:1px solid var(--line)}
.nextbar.show{display:flex}
</style>
<style id="cyber">
/* ===== CYBERPUNK THEME ===== */
:root{
  --bg:#0a0506; --card:#140809; --card2:#1f0e10; --line:#4a1c1e; --text:#f3e9e6; --muted:#a3807d;
  --blue:#5ef2f2; --green:#5ef2f2; --red:#ff5a4f; --gold:#f5d33a; --mag:#ff5a4f;
  --bench:#f5d33a; --hinge:#5ef2f2; --squat:#ff8a5c; --ohp:#ff5a4f;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --head:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",-apple-system,sans-serif;
}
html,body{background:var(--bg)}
body{background:
  radial-gradient(1000px 600px at 50% -10%,rgba(255,90,79,.20),transparent 65%),
  radial-gradient(700px 400px at 110% 100%,rgba(94,242,242,.07),transparent 60%),
  linear-gradient(rgba(255,90,79,.045) 1px,transparent 1px) 0 0/100% 32px,
  linear-gradient(90deg,rgba(255,90,79,.045) 1px,transparent 1px) 0 0/32px 100%,
  var(--bg);background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
h1{font-family:var(--head);font-weight:800;font-size:30px;letter-spacing:1.5px;color:#fff;
  color:var(--red);text-shadow:1.5px 0 rgba(94,242,242,.55),0 0 18px rgba(255,90,79,.45)}
h2{font-family:var(--head);text-transform:uppercase;letter-spacing:2px;color:var(--red);text-shadow:0 0 10px rgba(255,90,79,.5);border-bottom:1px solid rgba(255,90,79,.5);padding-bottom:4px}
.muted{color:var(--muted)}
.card{background:linear-gradient(160deg,#1a0a0c 0%,#0d0607 100%);border:1px solid var(--line);border-left:2px solid var(--red);
  border-radius:0;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 0 24px rgba(94,242,242,.05)}
.card.warm{border:1px dashed #5a2426;border-left:2px dashed var(--blue);color:var(--muted);font-family:var(--mono);font-size:13px}
.ex-title{color:var(--red);font-family:var(--head);text-transform:uppercase;letter-spacing:1px;font-size:18px;text-shadow:0 0 10px rgba(255,90,79,.55)}
.ex-title .dot{border-radius:0;transform:rotate(45deg);box-shadow:0 0 8px currentColor}
.ex-target{color:var(--gold);font-family:var(--mono);font-size:12.5px;letter-spacing:.3px;text-shadow:0 0 8px rgba(245,211,58,.35)}
.ex-note{color:#c4a3a0}
th{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--blue)}
.setno{background:#0c0506;border:1px solid var(--line);border-radius:0;font-family:var(--mono);color:#f3e9e6}
.setno.w{color:#ff9f1c;background:#1d1208;border-color:#5a3a12}
.setno.prset{background:var(--gold);color:#140f00;border-color:var(--gold);box-shadow:0 0 12px rgba(245,211,58,.7)}
.prev{font-family:var(--mono);font-size:12px}
.cell{background:#070304;border:1px solid var(--line);border-radius:0;font-family:var(--mono);color:#fff}
.cell:focus{outline:none;border-color:var(--mag);box-shadow:0 0 0 1px var(--mag),0 0 14px rgba(255,90,79,.45)}
.cell::placeholder{color:#6e4a47}
.chk{background:#0c0506;border:1px solid #5a2426;border-radius:0}
.chk svg{stroke:#8a5a57}
tr.done .chk{background:var(--blue);border-color:var(--blue);box-shadow:0 0 14px rgba(94,242,242,.6)}
tr.done .chk svg{stroke:#021617}
tr.done .cell,tr.done .setno{background:#061a1b;border-color:#1d5d5f;color:#c9fbfb}
tr.done .setno.prset,.setno.prset{background:var(--gold);color:#140f00;border-color:var(--gold);box-shadow:0 0 12px rgba(245,211,58,.7)}
.addset{background:transparent;border:1px dashed #5a2426;border-radius:0;color:var(--blue);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-size:12px}
.btn{border-radius:0;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-size:13px;background:var(--card2);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn.primary{background:var(--mag);color:#1a0302;border-color:var(--mag);font-weight:800;box-shadow:0 0 18px rgba(255,90,79,.6)}
.btn.blue{background:var(--blue);color:#001518;border-color:var(--blue);font-weight:800}
.btn.danger{background:#2a0614;color:var(--red);border-color:#5c1430}
.chip,.mini{border-radius:0;background:transparent;border:1px solid var(--line);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-size:11px;color:var(--muted)}
.mini:active,.chip:active{border-color:var(--blue);color:var(--blue)}
.mynote{background:rgba(255,90,79,.07);border-left:2px solid var(--mag);border-radius:0;font-family:var(--mono);font-size:12.5px}
.prb{background:var(--gold);color:#140f00;border-radius:0;box-shadow:0 0 8px rgba(245,211,58,.7)}
.tabbar{background:rgba(10,5,6,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,90,79,.45);box-shadow:0 -6px 24px rgba(255,90,79,.12)}
.tab{font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;font-size:9.5px}
.tab.on{color:var(--blue);text-shadow:0 0 8px rgba(94,242,242,.8)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(94,242,242,.9))}
.timer{background:rgba(10,5,6,.95);border:1px solid var(--red);color:var(--red);border-radius:0;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:0 0 24px rgba(255,90,79,.35)}
.timer .t{font-family:var(--mono);text-shadow:0 0 14px rgba(255,90,79,.9)}
.timer .small{font-family:var(--mono);text-transform:uppercase;letter-spacing:2px}
.timer .btn{background:transparent!important;border:1px solid rgba(255,90,79,.5);color:var(--red)}
.timer.over{background:rgba(6,22,23,.96);border-color:var(--green);color:var(--green)}
.timer.over .t{text-shadow:0 0 14px rgba(94,242,242,.9)}
.timer.over .btn{border-color:rgba(94,242,242,.5);color:var(--green)}
.banner{background:rgba(245,211,58,.06);border:1px solid rgba(245,211,58,.55);color:var(--gold);border-radius:0;font-family:var(--mono);font-size:12.5px}
.sess{border-radius:0;background:rgba(20,8,9,.9);border:1px solid var(--line)}
.sess .st{border-radius:0;transform:rotate(45deg)} .sess .st>*{transform:rotate(-45deg)}
.sess.done .st{background:var(--green);border-color:var(--green);color:#03140a;box-shadow:0 0 10px rgba(94,242,242,.6)}
.sess.prog .st{border-color:var(--gold);color:var(--gold)}
.sess.next{outline:1px solid var(--blue);box-shadow:0 0 16px rgba(94,242,242,.35)}
.field input,select,textarea{border-radius:0!important;background:#070304!important;border:1px solid var(--line)!important;font-family:var(--mono)!important;color:#fff}
.stat{border-radius:0;background:#0c0506;border:1px solid var(--line)}
.stat .v{font-family:var(--mono);color:var(--blue);text-shadow:0 0 10px rgba(94,242,242,.5)}
.stat .l{font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;font-size:10px}
.toast{background:rgba(10,5,6,.95);border:1px solid var(--mag);color:#fff;border-radius:0;font-family:var(--mono);box-shadow:0 0 18px rgba(255,90,79,.5)}
.sheet{background:#0d0607;border-top:1px solid var(--blue);border-radius:0;box-shadow:0 -10px 40px rgba(94,242,242,.2)}
.feel button{border-radius:0;background:#0c0506;border:1px solid var(--line);font-family:var(--mono)}
.feel button.on{background:var(--mag);border-color:var(--mag);color:#1a0302;box-shadow:0 0 12px rgba(255,90,79,.6)}
.plate{border-radius:0;box-shadow:0 0 10px currentColor}
.nextbar{background:#0d0607;border-top:1px solid var(--mag)}
svg.chart text{font-family:var(--mono)}
svg.chart line{stroke:#2a1213}

.ex-title .dot{background:var(--blue)!important}
.stat .v{color:var(--gold);text-shadow:0 0 10px rgba(245,211,58,.4)}
.addset{color:var(--red)}
.sess.done .st{color:#021617}
</style>
<style id="precision">
/* ===== PRECISION / GRAND-TOURING LAYER (on top of cyberpunk) ===== */
body::before{content:"";position:fixed;left:0;right:0;top:env(safe-area-inset-top);height:2px;z-index:90;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(255,90,79,.25) 8%,#ff5a4f 20%,#ff6a5f 50%,#ff5a4f 80%,rgba(255,90,79,.25) 92%,transparent 100%);
  box-shadow:0 0 10px rgba(255,90,79,.9),0 0 24px rgba(255,90,79,.5)}
.tabbar::before{content:"";position:absolute;left:6%;right:6%;top:-1px;height:2px;
  background:linear-gradient(90deg,transparent,#ff5a4f 15%,#ff5a4f 85%,transparent);box-shadow:0 0 10px rgba(255,90,79,.8)}
h1{font-weight:600;letter-spacing:4px;font-size:27px;text-shadow:0 0 16px rgba(255,90,79,.45)}
.ex-title{font-weight:600;letter-spacing:2px;font-size:16px}
.card{position:relative}
.card::before,.card::after{content:"";position:absolute;left:0;right:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(243,233,230,.16) 18%,rgba(243,233,230,.05) 60%,transparent 100%)}
.card::before{top:7px}
.card::after{bottom:7px;background:linear-gradient(90deg,transparent 0%,rgba(94,242,242,.05) 40%,rgba(94,242,242,.18) 82%,transparent 100%)}
.card.warm::before,.card.warm::after{display:none}
.gauge{flex:none}
.gauge .trk{fill:none;stroke:#2a1213;stroke-width:6}
.gauge .arc{fill:none;stroke-width:6;stroke-linecap:butt;transition:stroke-dasharray .25s linear}
.gauge .tk{stroke:#6e4a47;stroke-width:1.2}
.gauge .tk.hot{stroke:#ff5a4f}
.gauge text{font-family:var(--mono);text-anchor:middle;dominant-baseline:central}
.timer{align-items:center;gap:8px}
.timer,.timer.over{background:#0a0506!important}
.timer.over{background:#061617!important}
.timer .btn{padding:8px 9px;font-size:12px;letter-spacing:.5px}
.timer .lbl{white-space:nowrap}
.timer .lbl{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;opacity:.85}
.hdrrow{display:flex;align-items:center;gap:12px}
.jag svg{width:100%;height:100%;display:block}
.jag img,.jagmini img{image-rendering:auto;-webkit-user-drag:none}
</style>
<style id="corpo">
/* ===== MEGA-CORP LAYER: cold steel, stark white, red accent ===== */
:root{--bg:#05070b;--card:#0b1016;--card2:#121a23;--line:#24303c;--text:#eef3f8;--muted:#7d8a99;
  --blue:#8fd3ff;--green:#8fd3ff;--red:#ff3b3b;--mag:#ff3b3b;--gold:#f5d33a;--hinge:#8fd3ff;--squat:#c9d4df;--ohp:#ff3b3b;--bench:#f5d33a}
body{background:
  radial-gradient(900px 260px at 50% 104%,rgba(255,59,59,.30),transparent 70%),
  repeating-linear-gradient(90deg,rgba(143,211,255,.035) 0 1px,transparent 1px 46px),
  linear-gradient(180deg,#132131 0%,#0a111a 30%,#05070b 70%);background-attachment:fixed}
body::before{background:linear-gradient(90deg,transparent,#ff3b3b 18%,#ff3b3b 82%,transparent);box-shadow:0 0 8px rgba(255,59,59,.7)}
h1{color:#fff;text-shadow:none;letter-spacing:5px;font-weight:600}
h1::after{content:"";display:block;width:56px;height:3px;background:var(--red);margin-top:6px}
h2{color:#fff;text-shadow:none;border-bottom:1px solid var(--line);letter-spacing:4px;font-size:15px}
h2::before{content:"// ";color:var(--red)}
.card{background:linear-gradient(180deg,#0e151d 0%,#090d12 100%);border-left:2px solid var(--red);box-shadow:none}
.card.warm{border-left:2px dashed #8fd3ff}
.ex-title{color:#fff;text-shadow:none}
.ex-title .dot{background:var(--red)!important;box-shadow:none}
.ex-target{color:#8fd3ff;text-shadow:none}
th{color:#7d8a99}
.cell:focus{border-color:#8fd3ff;box-shadow:0 0 0 1px #8fd3ff}
tr.done .chk{background:#eef3f8;border-color:#eef3f8;box-shadow:none} tr.done .chk svg{stroke:#05070b}
tr.done .cell,tr.done .setno{background:#0f1a24;border-color:#2f4a60;color:#fff}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red);box-shadow:none}
.btn.blue{background:#eef3f8;color:#05070b;border-color:#eef3f8}

<script>
"use strict";
/* =========================================================
   PROGRAM DEFINITION
   Weight system copied from the old program:
   - Week 2 rep-max tests set the max: weight x (1 + (reps+1)/30), rounded to 5
   - Projected maxes: incline = 88.9% of paused bench, close-grip = 107.4% of paused bench
     (same ratios as the old program: 240/270 and 290/270), each adjustable +/-%
   - Weight = % x max, rounded to 5 lb
   - Back-off = 90% of top set, fatigue drop = 95% of back-off
   - Front squat backdowns 95% / 90% of top set
   - Week 6 front squat 8RM re-test drives weeks 7-9 (old program re-tested its secondary squat mid-block)
   - RDL backdowns fixed at 68% of max
   - Week 10 re-test sets maxes for the next block
   ========================================================= */
const ACC={1:'4 RIR',2:'3 RIR',3:'3 RIR',4:'2 RIR',5:'2 RIR',6:'3 RIR',7:'2 RIR',8:'2 RIR',9:'1 RIR',10:'3 RIR'};
const ISO={1:'3 RIR',2:'2 RIR',3:'2 RIR',4:'2 RIR',5:'1 RIR',6:'2 RIR',7:'2 RIR',8:'1 RIR',9:'1 RIR',10:'3 RIR'};
const WU_UP='Warm-up: 5 min bike + shoulder dislocates, band pull-aparts, thoracic roll';
const WU_LO='Warm-up: 5 min bike + hip flexion/rotation, banded glute walks, bird dogs';
const ns=(w,n,sec)=>w===1?Math.max(2,n-1):(w===10&&sec?1:n);
const R=v=>({t:'rir',v}), P=(lift,p)=>({t:'pct',lift,p}), REL=(ref,f)=>({t:'rel',ref,f}), T=key=>({t:'test',key}), F8=p=>({t:'f8',p});
const E=(id,name,cat,load,sets,reps,note,main)=>({id,name,cat,load,sets,reps,note:note||'',main:!!main});
const WU=t=>({id:'wu',name:t,warm:true});
const pc=p=>Math.round(p*100)+'%';

function day1(w){
  const r=[WU(WU_UP),E('curl_db','DB Preacher Curl','',R(ISO[w]),ns(w,4),8,'Over the incline bench back. Superset with your bench warm-up sets.')];
  if(w===1) r.push(E('pbench','3-Count Paused Bench','bench',R('4 RIR'),3,8,'Pick a weight that leaves 4 reps in reserve.',1));
  else if(w===2) r.push(E('pbench','3-Count Paused Bench — TEST','bench',T('bench'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your bench max.',1),
                        E('pbench_bo','Paused Bench Back-offs','bench',REL('pbench',.85),2,6,'85% of your test weight.'));
  else if(w===10) r.push(E('pbench','3-Count Paused Bench — RE-TEST','bench',T('bench_rt'),1,'3–5','Work up to a hard set of 3–5. Stop with 1 rep left. This sets next block\'s max.',1));
  else{const [p,s,rp]={3:[.75,3,7],4:[.75,4,7],5:[.75,5,7],6:[.80,3,5],7:[.80,4,5],8:[.80,5,5],9:[.85,3,3]}[w];
       r.push(E('pbench','3-Count Paused Bench @ '+pc(p),'bench',P('bench',p),s,rp,'3-second pause on the chest every rep.',1));}
  r.push(E('row_cable','Cable Seated Row','',R(w===1?'4 RIR':ACC[w]),ns(w,3),12,'Superset with your paused bench sets.'));
  if(w===1) r.push(E('cgb','Close-Grip Bench','bench',R('4 RIR'),2,8,'Replaces dips.'));
  else if(w===10) r.push(E('cgb','Close-Grip Bench','bench',R('3 RIR'),2,8,'Replaces dips.'));
  else{const [p,rp]={2:[.70,'8,8,8'],3:[.72,'8,7,7'],4:[.72,'8,8,7'],5:[.72,'8,8,8+'],6:[.75,'7,7,7'],7:[.75,'8,7,6'],8:[.75,'8,8,7'],9:[.78,'6,6,6']}[w];
       r.push(E('cgb','Close-Grip Bench @ '+pc(p),'bench',P('cgb',p),3,rp,'Same weight all 3 sets — beat the reps. Replaces dips.'));}
  r.push(E('sapd','Cable Straight-Arm Pulldown','',R(ISO[w]),ns(w,3),12,'Superset with rear delt fly.'));
  r.push(E('rdfly','Cable Rear Delt Fly','',R(ISO[w]),ns(w,3),12,''));
  r.push(E('pushdown','Cable Triceps Pushdown (optional)','bench',R(ISO[w]),3,10,w===6?'Pick a new grip or attachment.':'Up to 3 sets.'));
  return r;
}
function day2(w){
  const r=[WU(WU_LO)];
  const tempo=(w>=6&&w<=8)?' (3 sec lowering)':'';
  if(w===1) r.push(E('rdl','Romanian Deadlift','hinge',R('4 RIR'),3,8,'Leave 4 reps in reserve. End the set if you feel it in your low back instead of your hamstrings.',1));
  else if(w===2) r.push(E('rdl','Romanian Deadlift — TEST','hinge',T('rdl'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your RDL max.',1),
                        E('rdl_bo','RDL Back-offs','hinge',REL('rdl',.85),2,7,'85% of your test weight.'));
  else if(w===10) r.push(E('rdl','Romanian Deadlift — RE-TEST','hinge',T('rdl_rt'),1,'3–5','Work up to a hard set of 3–5. Stop with 1 rep left. This sets next block\'s max.',1));
  else{const [p,rp,bs,br]={3:[.75,8,2,7],4:[.77,8,3,7],5:[.77,8,4,7],6:[.75,8,2,7],7:[.77,8,3,7],8:[.77,8,4,7],9:[.80,6,2,6]}[w];
       r.push(E('rdl','RDL Top Set @ '+pc(p)+tempo,'hinge',P('rdl',p),1,rp,'Brace hard. Stop if it moves to your low back.',1),
              E('rdl_back','RDL Backdowns @ 68%'+tempo,'hinge',P('rdl',.68),bs,br,'Fixed at 68% of your max, like the old program.'));}
  r.push(E('dbsquat','Heel-Elevated DB Squat or Goblet Squat','squat',R(ACC[w]),ns(w,3),w<6?10:8,w===6?'Switch to the other variation this block.':'DBs at your sides or one at your chest.'));
  r.push(E('pullup','Pull-ups','',R(ACC[w]),ns(w,3),'6–10','Leave weight blank for bodyweight. If you add weight later, enter only the added weight.'));
  r.push(E('hamcurl','Cable Hamstring Curl (ankle strap)','hinge',R(ISO[w]),ns(w,3),w<6?15:12,'Superset with shrugs.'));
  r.push(E('shrug','DB Shrugs','',R((w===1||w===10)?'3 RIR':'1 RIR'),ns(w,3),w<7?12:10,''));
  return r;
}
function day3(w){
  const r=[WU(WU_UP),E('bbcurl','Barbell Curl','',R(w>1?'2 RIR':'3 RIR'),ns(w,4,1),(w>=6&&w<=8)?8:10,'Superset with your bench warm-up sets to warm the elbows.')];
  if(w===1) r.push(E('incl_top','T-Shirt Touch Slight Incline Bench','bench',R('4 RIR'),3,8,'Pick a weight that leaves 4 reps in reserve.',1));
  else if(w===2) r.push(E('incl_top','Slight Incline Bench @ 75%','bench',P('incline',.75),3,6,'Calculated from Monday\'s bench test.',1));
  else if(w===10) r.push(E('incl_top','Slight Incline Bench @ 70% (deload)','bench',P('incline',.70),1,6,'Easy week.',1));
  else{const p={3:.80,4:.83,5:.85,6:.78,7:.80,8:.83,9:.80}[w];
       const tt=(w>=6&&w<=8)?' — 3s lower, 1s hold at top':(w===9?' — 3s lower, 3s pause':'');
       const tb=(w>=6&&w<=8)?' — 3s lower':'';
       r.push(E('incl_top','Incline Top Set @ '+pc(p)+tt,'bench',P('incline',p),1,5,'T-shirt touch. One hard set of 5.',1),
              E('incl_back','Incline Back-offs @ 90% of top'+tb,'bench',REL('incl_top',.90),3,6,'If a set hits RPE 9+, drop to {drop} lb for the rest of the sets.'));}
  r.push(E('latpd','Cable Lat Pulldown','',R(ACC[w]),ns(w,4,1),(w>=6&&w<=8)?10:12,w===7?'Choose a new bar or grip.':'Kneeling or seated.'));
  r.push(E('dbohp',((w===7||w===8)?'Paused ':'')+'Seated DB Overhead Press','ohp',R(ACC[w]),ns(w,3,1),(w>=6&&w<=8)?10:12,'Weight = one dumbbell. Superset with wrist curls.'));
  const seq={1:1,2:2,3:2,4:3,5:3,6:1,7:2,8:3,9:3,10:1}[w];
  r.push(E('lateral',((w===7||w===8)?'Lu Raise':'DB Lateral Raise')+' Myoreps','ohp',R((w===1||w===6||w===10)?'3 RIR':'1 RIR'),seq,'12+6+3','Each row = one myorep sequence: 12 reps, rest 4 sec, 6 reps, rest 4 sec, 3+ reps. Log total reps.'));
  r.push(E('csrow','Chest-Supported DB Row'+((w===7||w===8)?' (slow lowering)':''),'',R(ACC[w]),ns(w,4,1),10,'Chest on the incline bench. Weight = one dumbbell.'));
  return r;
}
function day4(w){
  const r=[WU(WU_LO)];
  const tempo=(w>=6&&w<=8)?' (3 sec lowering)':'';
  if(w===1) r.push(E('fsq_top','Front Squat','squat',R('4 RIR'),3,8,'Leave 4 reps in reserve. Heavy DB squat is fine if front squats bother your back.',1));
  else if(w===2) r.push(E('fsq_top','Front Squat — TEST','squat',T('front'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your front squat max.',1),
                        E('fsq_bo','Front Squat Back-offs','squat',REL('fsq_top',.85),2,8,'85% of your test weight.'));
  else if(w===10) r.push(E('fsq_top','Front Squat @ 65% (deload)','squat',P('front',.65),1,8,'Easy week.',1));
  else if(w===6) r.push(E('fsq_top','Front Squat — 8 REP MAX RE-TEST','squat',T('front8'),1,8,'Ramp up to your heaviest clean set of 8. This sets weeks 7–9.',1),
                        E('fsq_bd2','Front Squat Backdown 2 (90%)','squat',REL('fsq_top',.90),1,8,''),
                        E('fsq_bd3','Front Squat Backdown 3 (86%)','squat',REL('fsq_top',.86),1,8,''));
  else if(w>=7){const p={7:.90,8:.94,9:.96}[w], rp=w===9?6:8;
       r.push(E('fsq_top','Front Squat Top Set @ '+pc(p)+' of 8RM'+tempo,'squat',F8(p),1,rp,'Calculated from your week 6 re-test.',1),
              E('fsq_bd2','Front Squat Backdown 2 (95%)'+tempo,'squat',REL('fsq_top',.95),1,rp,''),
              E('fsq_bd3','Front Squat Backdown 3 (90%)'+tempo,'squat',REL('fsq_top',.90),1,rp,''));}
  else{const p={3:.70,4:.72,5:.74}[w];
       r.push(E('fsq_top','Front Squat Top Set @ '+pc(p),'squat',P('front',p),1,8,'',1),
              E('fsq_bd2','Front Squat Backdown 2 (95%)','squat',REL('fsq_top',.95),1,8,''),
              E('fsq_bd3','Front Squat Backdown 3 (90%)','squat',REL('fsq_top',.90),1,8,''));}
  r.push(E('pullthru','Cable Pull-Through','hinge',R(ACC[w]),ns(w,3,1),12,'Replaces good mornings — easy on the low back.'));
  r.push(E('split','DB Split Squat'+((w===7||w===8)?' (slow lowering)':''),'squat',R(ACC[w]),ns(w,3,1),'10/leg','Rear foot elevated if comfortable. Weight = one dumbbell.'));
  r.push(E('crunch','Cable Crunch','',R(w>1?'0 RIR':'2 RIR'),ns(w,2,1),15,w===6?'Pick a new ab exercise. Superset with wrist extensions.':'Superset with wrist extensions.'));
  r.push(E('deadbug','Dead Bug','',R('Slow'),ns(w,2,1),'10/side','Low back pressed into the floor.'));
  r.push(E('kbswing','KB Swings (optional finisher)','hinge',{t:'fixed',v:35},ns(w,3,1),15,'Or 5 minutes of bike intervals.'));
  return r;
}
function travelDay(fn){ // repeat Week 1 day at 3 RIR
  return fn(1).map(e=>{if(e.warm)return e; const c={...e,load:{...e.load}}; if(c.load.t==='rir'&&c.load.v==='4 RIR')c.load.v='3 RIR'; return c;});
}
const tripA=()=>[WU('No equipment. About 30 minutes.'),
  E('t_pushup','Push-ups','bench',R('2 RIR'),4,'AMRAP',''),E('t_bss','Bulgarian Split Squat (foot on bed/chair)','squat',R('2 RIR'),3,'12/leg',''),
  E('t_pike','Pike Push-ups','ohp',R('2 RIR'),3,'8–10',''),E('t_bridge','Single-Leg Glute Bridge','hinge',R('2 RIR'),3,'12/leg',''),
  E('t_towel','Towel Row (around a door handle)','',R('2 RIR'),3,12,''),E('t_deadbug','Dead Bug','',R('Slow'),3,'10/side','')];
const tripB=()=>[WU('No equipment. About 30 minutes.'),
  E('t_decline','Decline Push-ups (feet on bed)','bench',R('2 RIR'),3,'AMRAP',''),E('t_lunge','Reverse Lunges','squat',R('2 RIR'),3,'12/leg',''),
  E('t_slrdl','Single-Leg RDL (bodyweight, slow)','hinge',R('Slow'),3,'10/leg',''),E('t_diamond','Close-Grip / Diamond Push-ups','bench',R('2 RIR'),3,'AMRAP',''),
  E('t_birddog','Bird Dog','',R('Slow'),3,'10/side',''),E('t_sideplank','Side Plank','',R('Hold'),2,'30s/side','')];

const JAG=`<img src="mascot-head.png" alt="Ocelotl Corp jaguar" style="width:100%;height:100%;object-fit:contain;display:block">`;
const JAG_BADGE=`<img src="mascot-badge.png" alt="Ocelotl Corp badge" style="width:100%;height:100%;object-fit:contain;display:block">`;
const JAG_EM=`<img src="mascot.png" alt="Ocelotl Corp emblem" style="width:100%;height:100%;object-fit:contain;display:block">`;
const DAYNAMES=['Day 1 — Primary Upper','Day 2 — Primary Lower','Day 3 — Secondary Upper','Day 4 — Secondary Lower'];
const FNS=[day1,day2,day3,day4];
const DATES={1:['2026-10-26','2026-10-27','2026-10-29','2026-10-30'],2:['2026-11-10','2026-11-11','2026-11-13','2026-11-14'],
 3:['2026-11-16','2026-11-17','2026-11-19','2026-11-20'],4:['2026-11-23','2026-11-24','2026-11-25','2026-11-27'],
 5:['2026-11-30','2026-12-01','2026-12-03','2026-12-04'],6:['2026-12-07','2026-12-08','2026-12-10','2026-12-11'],
 7:['2026-12-14','2026-12-15','2026-12-17','2026-12-18'],8:['2026-12-21','2026-12-22','2026-12-23','2026-12-26'],
 9:['2026-12-28','2026-12-29','2026-12-30','2027-01-02'],10:['2027-01-04','2027-01-05','2027-01-07','2027-01-08']};
const SESSIONS=[];
const DAY_OFF=[0,1,3,4]; // Mon Tue Thu Fri
function buildSessions(){
 SESSIONS.length=0;const blk=S.block||1,pre=blk>1?'B'+blk+' · ':'';
 for(let w=1;w<=10;w++){
  for(let d=0;d<4;d++) SESSIONS.push({id:`w${w}d${d+1}`,week:w,wlabel:pre+'Week '+w,name:DAYNAMES[d],date:blk>1?addDays(S.blockStart,(w-1)*7+DAY_OFF[d]):DATES[w][d],ex:FNS[d](w)});
  if(w===1&&blk===1){
    SESSIONS.push({id:'tr1',week:'T',wlabel:'Travel week',name:'Home — repeat Week 1 Day 1 @ 3 RIR',date:'2026-11-02',ex:travelDay(day1)});
    SESSIONS.push({id:'tr2',week:'T',wlabel:'Travel week',name:'Home — repeat Week 1 Day 2 @ 3 RIR',date:'2026-11-03',ex:travelDay(day2)});
    SESSIONS.push({id:'tra',week:'T',wlabel:'Travel week',name:'Trip — Bodyweight Session A',date:'2026-11-06',ex:tripA()});
    SESSIONS.push({id:'trb',week:'T',wlabel:'Travel week',name:'Trip — Bodyweight Session B',date:'2026-11-08',ex:tripB()});
  }
 }
 // missed-workout catch-up: each shift pushes that session and everything after it later
 (S.shifts||[]).forEach(sh=>{const i=SESSIONS.findIndex(s=>s.id===sh.from);if(i<0)return;for(let k=i;k<SESSIONS.length;k++)SESSIONS[k].date=addDays(SESSIONS[k].date,sh.days)});
}
const MAIN_LIFTS=[{id:'pbench',name:'Paused Bench',c:'var(--bench)'},{id:'incl_top',name:'Slight Incline Bench',c:'var(--bench)'},
  {id:'cgb',name:'Close-Grip Bench',c:'var(--bench)'},{id:'rdl',name:'Romanian Deadlift',c:'var(--hinge)'},{id:'fsq_top',name:'Front Squat',c:'var(--squat)'},
  {id:'dbohp',name:'Seated DB Press',c:'var(--ohp)'},{id:'csrow',name:'Chest-Supported DB Row',c:'#9aa3b1'},{id:'dbsquat',name:'Heel-Elevated DB Squat',c:'var(--squat)'}];

/* =========================================================
   STATE
   ========================================================= */
const KEY='recomp_tracker_v1',BAK=KEY+'_bak';
const BASE_T={rest:{kcal:2000,p:160,c:85,f:100},train:{kcal:2150,p:160,c:110,f:100}};
const DEFAULT={version:1,created:new Date().toISOString(),
  maxes:{start:{bench:205,rdl:275,front:185},tests:{},adj:{bench:100,incline:100,cgb:100,rdl:100,front:100},front8:null,retest:{}},
  bw:[],logs:{},cur:null,tab:'workout'};
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);

/* Swap */
function swapEx(exid){const s=sess(S.cur),L=ensureLog(s);L.swap=L.swap||{};
  if(L.swap[exid]){if(!confirm('Undo the swap and go back to '+exName(exid)+'?'))return;delete L.swap[exid];applyTests(s);save();vWorkoutKeep();return}
  const v=prompt('Swap '+exName(exid)+' for which exercise today?','');if(!v||!v.trim())return;L.swap[exid]=v.trim();applyTests(s);save();vWorkoutKeep();toast('Swapped for today only')}

function setSessNote(v){const s=sess(S.cur),L=ensureLog(s);L.note=v.trim();save()}

/* Backup reminder */
function firstActivity(){let t=Infinity;Object.values(S.logs).forEach(L=>{if(L.start)t=Math.min(t,L.start)});
  Object.values(S.food||{}).forEach(F=>F.items.forEach(i=>{if(i.t)t=Math.min(t,i.t)}));(S.archive||[]).forEach(A=>Object.values(A.logs).forEach(L=>{if(L.start)t=Math.min(t,L.start)}));return isFinite(t)?t:null}

function blockEnd(){let t=0;Object.values(S.logs).forEach(L=>{if(L.end)t=Math.max(t,L.end)});return t}

  ${LOAD_NOTE?`<div class="banner">${esc(LOAD_NOTE)}</div>`:''}

  <div class="card"><div style="font-weight:700">Step 2 — Start Block ${blk+1}</div><div class="muted small" style="margin:6px 0 10px">Same 10-week template (no travel week), Mon/Tue/Thu/Fri starting ${fmtDate(nextMonday())}. Weights come from your re-test maxes: paused bench ${nb.bench} lb, RDL ${nb.rdl} lb, front squat ${nb.front} lb. PRs, charts and "previous" carry over.</div>
    <button class="btn primary" style="width:100%" onclick="startNextBlock()">Start Block ${blk+1}</button></div>
  <button class="btn" style="width:100%" onclick="showLast=true;S.cur=SESSIONS[SESSIONS.length-1].id;vWorkout()">View last session</button>`}
function nextMonday(){const td=today(),dow=new Date(td+'T12:00:00').getDay();return addDays(td,dow===1?0:(8-dow)%7)}
function startNextBlock(){
  if(!(S.lastExport&&S.lastExport>=blockEnd())&&!confirm('You have not exported this block yet. Start the next block anyway? (Tap Cancel, then Export first — recommended.)'))return;
  const M=maxes(),rt=S.maxes.retest,blk=S.block||1;
  S.archive.push({block:blk,ended:today(),maxes:JSON.parse(JSON.stringify(S.maxes)),order:SESSIONS.map(s=>({id:s.id,date:s.date,name:s.name,wlabel:blk===1?'B1 · '+s.wlabel:s.wlabel})),logs:S.logs});
  S.maxes={start:{bench:rt.bench||M.bench,rdl:rt.rdl||M.rdl,front:M.front},tests:{},adj:{bench:100,incline:100,cgb:100,rdl:100,front:100},front8:null,retest:{}};
  S.logs={};S.shifts=[];S.block=blk+1;S.blockStart=nextMonday();buildSessions();S.cur=nextSession();showLast=false;save();go('workout');toast('Block '+S.block+' started')}
function vWorkout(){
  if(allDone()&&!showLast){vBlockDone();return}
  if(!S.cur||!sess(S.cur))S.cur=nextSession();
  const s=sess(S.cur), L=log(s.id), t=targets(s), st=sessionStatus(s.id);
  let elapsed='';if(L&&L.start){const mins=Math.round(((L.end||Date.now())-L.start)/60000);elapsed=Math.floor(mins/60)+':'+String(mins%60).padStart(2,'0')}
  let h=`<div class="row" style="margin-top:4px"><button class="chip" onclick="go('plan')">‹ ${esc(s.wlabel)}</button><div class="spacer"></div>
    ${st==='done'?'<span class="chip" style="color:var(--green)">Finished ✓</span>':`<button class="btn primary" onclick="finish()">Finish</button>`}</div>
    <div class="hdrrow"><div style="flex:1"><h1>${esc(s.name)}</h1><div class="muted small">${fmtDate(s.date)}${L&&L.date&&L.date!==s.date?' · done '+fmtDate(L.date):''}${elapsed?' · ⏱ '+elapsed:''}</div></div>
    ${(()=>{let tot=0,dn=0;s.ex.forEach(e=>{if(e.warm)return;const a=(L&&L.ex[e.id])||[];tot+=Math.max(exSets(e),a.length);dn+=a.filter(x=>x.done).length});const f=tot?dn/tot:0;
      return `<svg class="gauge" width="72" height="72" viewBox="0 0 100 100">${gaugeSVG(f,Math.round(f*100)+'%','SETS',f>=1?'#8fd3ff':'#eef3f8',0.85)}</svg>`})()}</div>`;
  if(s.id==='w2d1'||s.id==='w2d2'||s.id==='w2d4')h+=`<div class="banner">EVALUATION DAY — log your heaviest set honestly. Results set your loads for the rest of the contract.</div>`;
  if(LOAD_NOTE)h+=`<div class="banner">${esc(LOAD_NOTE)}</div>`;
  {const b=behindInfo();if(b&&S.cur===b.nx.id)h+=`<div class="banner">BEHIND SCHEDULE — ${b.n} session${b.n>1?'s':''} overdue. ${esc(b.nx.name)} was due ${fmtDate(b.nx.date)}.
    <div class="behind"><button class="btn sm blue" onclick="shiftSchedule()">Do it today — shift my schedule</button><button class="btn sm" onclick="skipSess('${b.nx.id}')">Skip this day</button></div></div>`}
  if(weighDue())h+=weighCard();
  if(s.week===10)h+=`<div class="banner">CONTRACT TERM ENDING — after this week the app walks you through exporting and starting the next block.</div>`;
  if(needsBackup())h+=`<div class="banner">DATA RETENTION WARNING — no backup in 14+ days. <button class="btn sm blue" style="margin-left:6px" onclick="go('more')">Back up now</button></div>`;
  const PRS=prMap().pr;
  s.ex.forEach((e,ix)=>{
    if(e.warm){h+=`<div class="card warm">${esc(e.name)}</div>`;return}
    const sets=(L&&L.ex[e.id])||[], prev=previous(s.id,e.id), n=Math.max(exSets(e),sets.length);
    const tw=t[e.id], sw=L&&L.swap&&L.swap[e.id];
    let tgt=e.load.t==='rir'?`Target: ${esc(e.load.v)} · ${esc(e.reps)} reps`:e.load.t==='test'?`Target: heaviest set of ${esc(e.reps)} (1 rep left)`:(tw!=null?`Target: ${tw} lb × ${esc(e.reps)}`:'Target: log the set above first');
    if(e.load.t==='fixed')tgt=`Target: ${tw} lb × ${esc(e.reps)}`;
    if(sw)tgt=`Swapped today — pick a weight for ${esc(e.reps)} reps`;
    let note=e.note; if(note.includes('{drop}'))note=note.replace('{drop}',tw!=null?r5(tw*0.95):'95% of back-off');
    const bar=BARBELL.has(e.id)&&!sw;
    h+=`<div class="card"><div class="serial">PRT-${s.id.toUpperCase()}-${String(ix).padStart(2,'0')}<span class="bc" style="width:34px;height:9px"></span></div><div class="ex-title" style="padding-right:84px" onclick="showHistory('${e.id}')"><span class="dot" style="background:${catColor(e.cat)}"></span>${sw?esc(sw)+' <span class="muted small">(instead of '+esc(e.name)+')</span>':esc(e.name)} <span class="muted small">›</span></div>
      <div class="ex-target">${tgt}</div>${note&&!sw?`<div class="ex-note">${esc(note)}</div>`:''}
      ${S.notes[e.id]?`<div class="mynote" onclick="editNote('${e.id}')">${esc(S.notes[e.id])}</div>`:''}
      <div class="ex-tools">${bar?`<button class="mini" onclick="showPlates(${tw!=null?tw:(sets[0]&&sets[0].w)||(prev&&prev[0]&&prev[0].w)||0})">Plates</button>`:''}
        <button class="mini" onclick="editNote('${e.id}')">${S.notes[e.id]?'Edit note':'+ Note'}</button>
        <button class="mini" onclick="swapEx('${e.id}')">${sw?'Undo swap':'Swap'}</button>
        <button class="mini" onclick="showHistory('${e.id}')">History</button></div>
      <table><tr><th>Set</th><th>Previous</th><th>lbs</th><th>Reps</th><th style="width:48px">✓</th></tr>`;
    // Warm-up sets for main barbell lifts: bar x8, 50% x5, 70% x3, 85% x1 of the first work set
    if(bar&&e.main){const work=tw!=null?tw:((sets[0]&&sets[0].w)||(prev&&prev[0]&&prev[0].w)||null);
      if(work&&work>S.bar){const wu=[[S.bar,8],[Math.max(S.bar,r5(work*.5)),5],[Math.max(S.bar,r5(work*.7)),3],[Math.max(S.bar,r5(work*.85)),1]].filter((x,k,a)=>k===0||x[0]>a[k-1][0]);
        const wd=(L&&L.wu&&L.wu[e.id])||[];
        wu.forEach(([ww,rr],k)=>{h+=`<tr class="wu ${wd[k]?'done':''}"><td><div class="setno w">W</div></td><td class="prev">warm-up</td>
          <td><div class="cell" style="line-height:38px" onclick="showPlates(${ww})">${ww}</div></td><td><div class="cell" style="line-height:38px">${rr}</div></td>
          <td><button class="chk" onclick="toggleWU('${e.id}',${k})">${CHECK}</button></td></tr>`})}}
    for(let i=0;i<n;i++){
      const x=sets[i]||{}, p=prev&&prev[i];
      const phW=tw!=null?tw:(p&&p.w!=null?p.w:(e.id==='pullup'||e.id.startsWith('t_')?'BW':'')), phR=repTarget(e,i)??(p?p.r:'');
      h+=`<tr class="${x.done?'done':''}"><td><button class="setno${PRS[s.id+'|'+e.id+'|'+i]?' prset':''}" style="width:100%" onclick="delSet('${e.id}',${i})">${PRS[s.id+'|'+e.id+'|'+i]?'PR':i+1}</button></td>
        <td class="prev">${p&&p.done?(p.w?p.w+' × ':'BW × ')+p.r:'—'}</td>
        <td><input class="cell" enterkeyhint="next" inputmode="decimal" value="${x.w??''}" placeholder="${esc(phW)}" onchange="setVal('${e.id}',${i},'w',this.value)"></td>
        <td><input class="cell" enterkeyhint="next" inputmode="numeric" value="${x.r??''}" placeholder="${esc(phR)}" onchange="setVal('${e.id}',${i},'r',this.value)"></td>

    }
    h+=`</table><button class="addset" onclick="addSet('${e.id}')">+ Add Set</button><div class="muted small" style="text-align:center;margin-top:6px">Tap a set number to delete or clear it</div></div>`;
  });
  const fl=L&&L.feel;
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:8px">How did today feel?</div>
    <div class="feel">${[1,2,3,4,5].map(n=>`<button class="${fl===n?'on':''}" onclick="setFeel(${n})">${n}</button>`).join('')}</div>
    <div class="muted small" style="margin:6px 0 10px">1 = drained · 3 = normal · 5 = great</div>
    <textarea style="height:70px;font:15px -apple-system,Arial" placeholder="Notes: sleep, energy, low back, anything off…" onchange="setSessNote(this.value)">${esc((L&&L.note)||'')}</textarea></div>`;
  h+=`<div class="row" style="margin:16px 0"><button class="btn" onclick="moveSess(-1)">‹ Previous day</button><div class="spacer"></div><button class="btn" onclick="moveSess(1)">Next day ›</button></div>`;
  $('view').innerHTML=h;
}
function ensureLog(s){if(!S.logs[s.id])S.logs[s.id]={ex:{},start:null,end:null,date:null,finished:false};S.logs[s.id].t=Date.now();return S.logs[s.id]}
const LIFT_OF={pbench:'bench',pbench_bo:'bench',incl_top:'incline',incl_back:'incline',cgb:'cgb',rdl:'rdl',rdl_bo:'rdl',rdl_back:'rdl',fsq_top:'front',fsq_bo:'front',fsq_bd2:'front',fsq_bd3:'front'};
function usualWeight(s,exid){const t=targets(s)[exid];if(t)return t;const p=previous(s.id,exid);const w=p?p.filter(x=>x.done&&x.w>0).map(x=>x.w):[];
  if(w.length)return Math.max(...w);return LIFT_OF[exid]?maxes()[LIFT_OF[exid]]:null}
function setVal(exid,i,k,v){const s=sess(S.cur);let n=String(v).trim()===''?null:parseFloat(v);if(n!=null&&!isFinite(n)){toast('Numbers only');vWorkoutKeep();return}
  if(n!=null&&k==='w'){if(n<0||n>1000){toast('Weight must be 0–1000 lb');vWorkoutKeep();return}n=Math.round(n*2)/2;
    const ex0=s.ex.find(x=>x.id===exid),isTest=ex0&&ex0.load&&ex0.load.t==='test';
    const u=isTest?null:usualWeight(s,exid);if(u&&n>u*1.5&&n-u>=20&&!confirm(`${n} lb is a lot more than the usual ${u} lb for this exercise. Is that right?`)){vWorkoutKeep();return}}
  if(n!=null&&k==='r'){if(n<1||n>50){toast('Reps must be 1–50');vWorkoutKeep();return}n=Math.round(n)}
  const L=ensureLog(s);const a=L.ex[exid]||(L.ex[exid]=[]);while(a.length<=i)a.push({});
  a[i][k]=n;a[i].t=Date.now();
  if(a[i].done){applyTests(s);}save();}
// Test sets reset training weights, so a typo here would ruin weeks of targets
function testCheck(e,x){const k=e.load.key,M=maxes(),cur=k==='front8'?M.front8:k==='bench_rt'?M.bench:k==='rdl_rt'?M.rdl:M[k];
  const est=k==='front8'?epley(x.w,x.r)/(1+8/30):epley(x.w,x.r+1);if(!cur||!est)return true;const diff=Math.round(Math.abs(est/cur-1)*100);
  return diff<=30||confirm(`This test set puts your max at ${r5(est)} lb — ${diff}% ${est>cur?'above':'below'} the current ${cur} lb. Test sets set your training weights for the next weeks. Is it right?`)}
function toggle(exid,i){
  const s=sess(S.cur),L=ensureLog(s),e=s.ex.find(x=>x.id===exid);const a=L.ex[exid]||(L.ex[exid]=[]);while(a.length<=i)a.push({});

function lineChart(series,opts){
  // series: [{name,color,pts:[{x:Date ms,y,label}]}]
  const W=340,H=190,pl=38,pr=10,pt=10,pb=26;
  const all=series.flatMap(s=>s.pts);
  if(all.length===0)return `<div class="muted small" style="padding:20px 0;text-align:center">${opts.empty||'No data yet — log some sets.'}</div>`;
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const pad=Math.max(5,(y1-y0)*0.15);y0=Math.floor((y0-pad)/5)*5;y1=y0+Math.max(20,Math.ceil((y1+pad-y0)/20)*20);
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>H-pb-(y-y0)/(y1-y0)*(H-pt-pb);
  let g='';for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#353b46" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  const d1=new Date(x0),d2=new Date(x1);
  g+=`<text x="${pl}" y="${H-6}">${d1.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${d2.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`;
  series.forEach(s=>{if(!s.pts.length)return;const pts=s.pts.slice().sort((a,b)=>a.x-b.x);
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
    if(!s.dash)pts.forEach(p=>g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="${s.color}"/>`);});
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${leg}</div>`;
}
function liftHistory(exid){
  const pts=[],tops=[];
  histEntries().forEach(({s,L})=>{if(!L.ex[exid]||(L.swap&&L.swap[exid]))return;const b=bestSet(L.ex[exid]);if(!b)return;
    const x=new Date((L.date||s.date)+'T12:00:00').getTime();pts.push({x,y:Math.round(epley(b.w,b.r))});
    const top=Math.max(...L.ex[exid].filter(z=>z.done&&z.w>0).map(z=>z.w));tops.push({x,y:top});});
  return {pts,tops};
}

  ['2026-12-21','2026-12-27','A'],['2026-12-28','2027-01-03','B'],['2027-01-04','2027-01-10','C']];
const PREP={A:'Chicken Tinga — Instant Pot 12 min high, natural release 10',B:'Picadillo — sauté beef, then 5 min high, quick release',
  C:'Pork Chile Verde — 45 min high, natural release 15',D:'Beef Barbacoa — 60 min high, natural release 15'};
const PREP_DAY={A:'Sun Oct 25',B:'Sun Nov 1 (half batch)',C:'Mon Nov 9',D:'Sun Nov 15'};
const WATER_GOAL=8;
function ensureFuel(){if(!S.food)S.food={}; if(!S.foods)S.foods=[];
if(!S.targets)S.targets={rest:{kcal:2000,p:160,c:85,f:100},train:{kcal:2150,p:160,c:110,f:100}};
if(!S.checkins)S.checkins=[];}
ensureFuel();
function recipeFor(d){if(d<ROTATION[0][0])return 'A';for(const [a,b,k] of ROTATION){if(d>=a&&d<=b)return k}
  const t=new Date(d+'T12:00:00').getTime(),w=Math.floor((t-new Date('2026-10-26T12:00:00').getTime())/(7*864e5));return 'ABCD'[((w%4)+4)%4]}
function prepDayFor(d){if(d<ROTATION[0][0])return fmtDate(addDays(ROTATION[0][0],-1));
  for(const [a,b] of ROTATION){if(d>=a&&d<=b)return fmtDate(a==='2026-11-09'?a:addDays(a,-1))}
  const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-x.getDay());return fmtDate(x.toISOString().slice(0,10))}
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function fday(d){if(!S.food[d])S.food[d]={items:[],water:0,train:null};return S.food[d]}
let FD=null; // day shown on Fuel — never saved, so the tab always opens on today
const fuelDay=()=>FD||today();
function trainedOn(d){return SESSIONS.some(s=>{const L=log(s.id);return L&&L.date===d&&!L.skipped&&Object.values(L.ex||{}).some(a=>a.some(x=>x.done))})}
// Past days: training targets only if you actually trained. Today/future: if a workout is scheduled (or done).
function isTrainDay(d){const F=S.food[d];if(F&&(F.train===true||F.train===false))return F.train;
  if(trainedOn(d))return true;if(d<today())return false;
  return SESSIONS.some(s=>s.date===d&&s.id!=='tra'&&s.id!=='trb'&&!(log(s.id)&&log(s.id).skipped))}
function tgt(d){return isTrainDay(d)?S.targets.train:S.targets.rest}
function totals(d){const F=S.food[d]||{items:[]};return F.items.reduce((t,i)=>({kcal:t.kcal+i.kcal,p:t.p+i.p,c:t.c+i.c,f:t.f+i.f}),{kcal:0,p:0,c:0,f:0})}
function logFood(food,src){ensureFuel();const d=fuelDay(),F=fday(d),cl=v=>Math.max(0,Math.round(+v||0));
  F.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),name:String(food.name).slice(0,120),kcal:cl(food.kcal),p:cl(food.p),c:cl(food.c),f:cl(food.f),src:src||'quick',t:Date.now(),barcode:food.barcode||null});
  save();}
function lookupBarcode(code){return S.foods.find(f=>f.barcode===code)||null} // hook for a future scanner
// Meal 2 follows the calorie target: each check-in change becomes a concrete portion change
const PORTIONS=[{k:'cheese',kcal:55,p:3.5,c:0,f:4.5,max:3,u:'oz cheese',step:.5},{k:'avo',kcal:114,p:1.3,c:6,f:10.5,max:1,u:'avocado',step:.5},{k:'beans',kcal:55,p:3.5,c:10,f:0,max:2,u:'cup beans',step:.25}];
const frac=n=>{const w=Math.floor(n+1e-9),r=Math.round((n-w)*4);return (w||'')+(['','¼','½','¾'][r]||'')||'0'};
function portionChange(delta){const sg=Math.sign(delta);let rem=Math.abs(delta);const used={},o={kcal:0,p:0,c:0,f:0};
  while(rem>=30){const c=PORTIONS.find(x=>(used[x.k]||0)<(sg<0?x.max:2)&&x.kcal<=rem+30);if(!c)break;used[c.k]=(used[c.k]||0)+1;rem-=c.kcal;['kcal','p','c','f'].forEach(m=>o[m]+=sg*c[m])}
  const parts=PORTIONS.filter(x=>used[x.k]).map(x=>frac(used[x.k]*x.step)+' '+x.u);
  o.text=parts.length?parts.join(' + ')+(sg<0?' less':' more'):'';Object.keys(o).forEach(m=>{if(m!=='text')o[m]=Math.round(o[m])});return o}
const mealAdj=()=>portionChange(S.targets.rest.kcal-BASE_T.rest.kcal);
function meal2For(d){const k=recipeFor(d),r=PLAN_FOOD[k],b=PLAN_FOOD.base,a=mealAdj();
  return {name:'Meal 2 — '+r.name+' bowl'+(a.text?' ('+a.text+')':''),kcal:r.kcal+b.kcal+a.kcal,p:r.p+b.p+a.p,c:r.c+b.c+a.c,f:r.f+b.f+a.f,adj:a}}
function planLogged(prefix){const F=S.food[fuelDay()];return !!(F&&F.items.some(i=>i.src==='plan'&&i.name.startsWith(prefix)))}
function logMeal1(){if(planLogged('Meal 1')&&!confirm('Meal 1 is already logged for this day. Log it again?'))return;logFood(PLAN_FOOD.m1,'plan');toast('Meal 1 logged');vFuelKeep()}
function logMeal2(){const d=fuelDay();if(planLogged('Meal 2')&&!confirm('Meal 2 is already logged for this day. Log it again?'))return;
  logFood(meal2For(d),'plan');
  if(isTrainDay(d))logFood(PLAN_FOOD.tort,'plan');
  toast('Meal 2 logged'+(isTrainDay(d)?' + tortillas':''));vFuelKeep()}
function delFood(id){const F=fday(fuelDay());F.items=F.items.filter(i=>i.id!==id);S.delFood.push(id);if(S.delFood.length>300)S.delFood=S.delFood.slice(-300);save();vFuelKeep()}
function setWater(n){const F=fday(fuelDay());F.water=Math.max(0,Math.min(30,Math.round(+n||0)));if(n>30)toast('30 glasses max');save();vFuelKeep()}
function toggleTrain(){const d=fuelDay(),F=fday(d);F.train=!isTrainDay(d);save();vFuelKeep()}
function moveFuel(n){FD=addDays(fuelDay(),n);if(FD===today())FD=null;vFuel()}
function logSaved(i){const f=S.foods[i];if(!f)return;logFood(f,'saved');closeSheet();toast('Logged '+f.name.slice(0,40));vFuelKeep()}
function delSaved(i){if(!S.foods[i]||!confirm('Delete saved food "'+S.foods[i].name.slice(0,40)+'"?'))return;S.foods.splice(i,1);save();foodSheet('saved')}
function vFuelKeep(){const y=window.scrollY;vFuel();window.scrollTo(0,y)}
function macroGauge(val,goal,label,unit,color,size){const f=goal?val/goal:0;
  return `<div style="text-align:center"><svg class="gauge" width="${size}" height="${size}" viewBox="0 0 100 100">${gaugeSVG(Math.min(1,f),String(Math.round(val)),unit,(label==='kcal'&&f>1.05)?'#ff3b3b':color,null)}</svg>
    <div class="lbl" style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">${label} / ${goal}</div></div>`}
function foodSheet(kind){
  const field=(id,l,ph,mode)=>`<div class="field"><label>${l}</label><input id="${id}" inputmode="${mode||'decimal'}" placeholder="${ph||''}"></div>`;
  if(kind==='saved'){
    openSheet(`<h2 style="margin-top:0">Saved foods</h2>${S.foods.length?S.foods.map((f,i)=>`<div class="sess" onclick="logSaved(${i})">
      <div style="flex:1"><div style="font-weight:600">${esc(f.name)}</div><div class="muted small">${f.kcal} kcal · P${f.p} C${f.c} F${f.f}</div></div>
      <button class="mini" onclick="event.stopPropagation();delSaved(${i})">✕</button></div>`).join(''):'<div class="muted small">No saved foods yet.</div>'}
      <button class="btn blue" style="width:100%;margin-top:10px" onclick="foodSheet('new')">+ New food</button>`);return}
  const ttl={new:'New food',quick:'Quick add',out:'Ate out (estimate)'}[kind];
  openSheet(`<h2 style="margin-top:0">${ttl}</h2>
    ${kind!=='quick'?field('fName','Name',kind==='out'?'e.g. Fajitas at El Patio':'e.g. Jerky','text'):''}
    <div class="grid2">${field('fK','Calories','0')}${field('fP','Protein (g)','0')}${kind!=='quick'||true?field('fC','Carbs (g)','0')+field('fF','Fat (g)','0'):''}</div>
    ${kind==='new'?`<label class="row small" style="margin-top:10px"><input type="checkbox" id="fSave" checked> Save for one-tap logging later</label>`:''}
    ${kind==='out'?`<div class="muted small" style="margin-top:8px">Rough guess is fine. Restaurant meals are flagged in your review.</div>`:''}
    <button class="btn blue" style="width:100%;margin-top:12px" onclick="saveFoodSheet('${kind}')">Log it</button>`)}
function saveFoodSheet(kind){const v=id=>{const e=$(id);return e?e.value.trim():''};
  const nums={};for(const [k,id] of [['kcal','fK'],['p','fP'],['c','fC'],['f','fF']]){const t=v(id);const n=t===''?0:+t;if(!isFinite(n)){toast('Numbers only');return}if(n<0){toast('No negative numbers');return}nums[k]=n}
  const food=Object.assign({name:(v('fName')||(kind==='quick'?'Quick add':'Food')).slice(0,80)},nums);
  if(!food.kcal&&!food.p){toast('Enter calories or protein');return}
  if(food.kcal>10000||food.p>1000||food.c>1000||food.f>1000){toast('Too big for one item — max 10,000 kcal');return}
  if((food.kcal>3000||food.p>300||food.c>500||food.f>300)&&!confirm(`${food.kcal} kcal / ${food.p} g protein in one item is a lot. Log it anyway?`))return;
  if(kind==='new'&&$('fSave')&&$('fSave').checked)S.foods.push({...food,barcode:null});
  logFood(food,kind==='out'?'out':kind==='new'?'saved':'quick');closeSheet();toast('Logged');vFuelKeep()}
// Safety: never below these, and never more than 300 under the plan's starting targets
const KC_FLOOR={rest:Math.max(1800,BASE_T.rest.kcal-300),train:Math.max(1950,BASE_T.train.kcal-300)},KC_CEIL={rest:BASE_T.rest.kcal+500,train:BASE_T.train.kcal+500};
// Weight trend: straight-line fit through the last 14 days of weigh-ins (needs 3+ spanning a week)
function weightTrend(){const d=today(),pts=S.bw.filter(w=>w.d>addDays(d,-14)&&w.d<=d);if(pts.length<3)return null;
  const xs=pts.map(p=>Math.round((new Date(p.d+'T12:00:00')-new Date(d+'T12:00:00'))/864e5)),ys=pts.map(p=>p.v);
  if(Math.max(...xs)-Math.min(...xs)<7)return null;const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2});const sl=sxx?sxy/sxx:0;
  return {perWeek:sl*7,now:my+sl*(0-mx),n}}
function checkin(){const d=today(),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,tr=weightTrend();
  const days=[];for(let i=0;i<7;i++){const t=totals(addDays(d,-i));if(t.kcal>0)days.push(t.kcal)}
  const kc=avg(days),last=S.checkins[S.checkins.length-1],recent=last&&last.date>addDays(d,-6)&&last.date<=d;let change=null,msg;
  const rate=tr?(Math.abs(tr.perWeek)<0.05?'Weight flat':`${tr.perWeek<0?'Down':'Up'} ${Math.abs(tr.perWeek).toFixed(1)} lb/week`)+` (trend of ${tr.n} weigh-ins).`:'';
  if(!tr)msg='Need 3+ weigh-ins spread over at least a week (last 14 days). The Workout screen asks on Mon & Thu.';
  else if(days.length<4)msg=rate+' Log food at least 4 of the last 7 days for a calorie suggestion.';
  else if(recent)msg=rate+` Targets changed ${fmtDate(last.date)} — give it a week before changing again.`;
  else if(tr.perWeek>-0.2){if(S.targets.rest.kcal<=KC_FLOOR.rest)msg=rate+` Calories are at the safety floor (${KC_FLOOR.rest}) — don't cut more. Check portions and eating out, or add two 20-min bike rides a week.`;
    else{change=-Math.min(125,S.targets.rest.kcal-KC_FLOOR.rest);msg=rate+` For recomp aim for −0.25 to −0.75. Suggest ${change} kcal/day = ${portionChange(change).text||'a slightly smaller bowl'} in Meal 2.`}}
  else if(tr.perWeek<-1.0){if(S.targets.rest.kcal>=KC_CEIL.rest)msg=rate+' Faster than needed, but targets are already at the top of the range — hold.';
    else{change=Math.min(125,KC_CEIL.rest-S.targets.rest.kcal);msg=rate+` Faster than needed, which can cost muscle. Suggest +${change} kcal/day = ${portionChange(change).text} in Meal 2.`}}
  else msg=rate+' Right on target. Hold calories.';
  return {w1:tr?tr.now:null,rate:tr?tr.perWeek:null,kc,days:days.length,change,msg}}
function applyCheckin(delta){delta=+delta||0;const before=S.targets.rest.kcal;
  ['rest','train'].forEach(k=>{const T=S.targets[k];T.kcal=Math.round(Math.min(KC_CEIL[k],Math.max(KC_FLOOR[k],T.kcal+delta)))});
  const got=S.targets.rest.kcal-before;if(!got){toast(delta<0?'At the safety floor — not lowering further':'At the top of the range');vFuelKeep();return}
  S.checkins.push({date:today(),delta:got,targets:JSON.parse(JSON.stringify(S.targets))});save();
  const a=mealAdj();toast('Targets '+(got>0?'+':'')+got+' kcal'+(a.text?' · Meal 2: '+a.text:''));vFuelKeep()}
function vFuel(){
  ensureFuel();
  const d=fuelDay(),F=S.food[d]||{items:[],water:0},T=tgt(d),t=totals(d),tr=isTrainDay(d),k=recipeFor(d),m2=meal2For(d);
  const isToday=d===today();
  let h=`<div class="hdrrow"><div style="flex:1"><h1>Fuel</h1><div class="muted small">Intake log // ${tr?'training':'rest'} day targets</div></div></div>
  <div class="row" style="margin:10px 0"><button class="btn sm" onclick="moveFuel(-1)">‹</button><div style="flex:1;text-align:center;font-family:var(--mono);letter-spacing:1px">${isToday?'TODAY · ':''}${fmtDate(d)}</div><button class="btn sm" onclick="moveFuel(1)">›</button></div>
  <div class="card"><div class="row" style="justify-content:center;gap:4px">${macroGauge(t.kcal,T.kcal,'kcal','KCAL','#eef3f8',128)}</div>
    <div class="row" style="justify-content:space-around;margin-top:4px">${macroGauge(t.p,T.p,'Protein','G','#8fd3ff',88)}${macroGauge(t.c,T.c,'Carbs','G','#f5d33a',88)}${macroGauge(t.f,T.f,'Fat','G','#ff8a3d',88)}</div>
    <div style="text-align:center;margin-top:8px;font-family:var(--mono);font-size:13px">${t.p>=T.p?'Protein target met ✓':`<b>${Math.round(T.p-t.p)} g</b> protein to go · ${Math.max(0,Math.round(T.kcal-t.kcal))} kcal left`}</div>
    <div style="text-align:center;margin-top:8px"><button class="mini" onclick="toggleTrain()">${tr?'Training day':'Rest day'} — tap to switch</button></div></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">Plan meals</div>
    <button class="sess" style="width:100%;text-align:left" onclick="logMeal1()"><div style="flex:1"><div style="font-weight:600">Meal 1 — Chorizo & egg scramble + yogurt</div><div class="muted small">920 kcal · P83 C27 F52</div></div><span class="mini">+ Log</span></button>
    <button class="sess" style="width:100%;text-align:left" onclick="logMeal2()"><div style="flex:1"><div style="font-weight:600">Meal 2 — ${PLAN_FOOD[k].name} bowl</div><div class="muted small">${m2.kcal} kcal · P${m2.p} C${m2.c} F${m2.f}${tr?' · + 2 tortillas today':''}</div>${m2.adj.text?`<div class="small" style="color:var(--gold);margin-top:2px">Adjusted for your target: ${esc(m2.adj.text)}</div>`:''}</div><span class="mini">+ Log</span></button>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><button class="mini" onclick="logFood(PLAN_FOOD.tort,'plan');toast('Tortillas logged');vFuelKeep()">+ 2 tortillas</button>
      <button class="mini" onclick="foodSheet('saved')">Saved foods</button><button class="mini" onclick="foodSheet('quick')">Quick add</button><button class="mini" onclick="foodSheet('out')">Ate out</button></div></div>`;
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Logged</div>${F.items.length?F.items.map(i=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
    <div style="flex:1"><div style="font-weight:600">${esc(i.name)}${i.src==='out'?' <span class="prb" style="background:#ff8a3d">ATE OUT</span>':''}</div><div class="muted small">${i.kcal} kcal · P${i.p} C${i.c} F${i.f}</div></div>
    <button class="mini" onclick="delFood('${i.id}')">✕</button></div>`).join(''):'<div class="muted small">Nothing logged yet. Tap a plan meal above.</div>'}</div>`;
  const w=F.water||0;
  h+=`<div class="card"><div class="row"><div style="font-weight:700;flex:1">Water</div><div style="font-family:var(--mono)">${w} / ${WATER_GOAL} glasses</div></div>
    <div class="row" style="gap:4px;margin:10px 0;flex-wrap:wrap">${Array.from({length:Math.max(WATER_GOAL,w)},(_,i)=>`<div style="width:26px;height:30px;border:1px solid ${i<w?'#8fd3ff':'#2a3644'};background:${i<w?'rgba(143,211,255,.35)':'transparent'}"></div>`).join('')}</div>
    <div class="row" style="gap:8px"><button class="btn sm" onclick="setWater(${w-1})">− Glass</button><button class="btn sm blue" onclick="setWater(${w+1})">+ Glass</button></div></div>`;
  const ci=checkin();
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Weekly check-in</div>
    <div class="grid2" style="margin-bottom:8px"><div class="stat"><div class="v">${ci.rate!=null?(ci.rate>0?'+':'')+ci.rate.toFixed(1):'—'}</div><div class="l">Trend lb/week${ci.w1!=null?' · now '+ci.w1.toFixed(1):''}</div></div><div class="stat"><div class="v">${ci.kc!=null?Math.round(ci.kc):'—'}</div><div class="l">Avg kcal (${ci.days} days)</div></div></div>
    <div class="small" style="line-height:1.4">${esc(ci.msg)}</div>
    <div class="row" style="margin-top:10px"><div class="field" style="flex:1"><label>Log today's weight (lb)</label><input id="bwIn" inputmode="decimal" placeholder="${S.bw.length?S.bw[S.bw.length-1].v:''}"></div><button class="btn blue" style="margin-top:18px" onclick="addBW();vFuelKeep()">Save</button></div>
    ${ci.change?`<button class="btn blue" style="width:100%;margin-top:10px" onclick="applyCheckin(${ci.change})">Apply ${ci.change>0?'+':''}${ci.change} kcal to targets</button>`:''}
    <div class="muted small" style="margin-top:8px">Targets: rest ${S.targets.rest.kcal} kcal · training ${S.targets.train.kcal} kcal · protein ${S.targets.rest.p} g · floor ${KC_FLOOR.rest}/${KC_FLOOR.train}</div></div>`;
  $('view').innerHTML=h;
}

/* boot */
FD=null;
try{renderTabs();render();if(!$('view').innerText.includes('Screen error'))keepGoodCopy()}catch(e){console.error(e)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
