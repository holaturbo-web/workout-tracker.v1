<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Recomp Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#16181d; --card:#22262e; --card2:#2b3039; --line:#353b46; --text:#f2f4f7; --muted:#8b93a1;
  --blue:#3fa0ff; --green:#2fca6c; --red:#ff5a5f; --gold:#e6b93c;
  --bench:#e6b93c; --hinge:#4f9dff; --squat:#3fcf7a; --ohp:#ff9a4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom)) 0;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 24px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.3px;text-transform:uppercase}
h2{font-size:18px;margin:18px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{background:var(--card2);padding:10px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--green);color:#06210f}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:#3a2226;color:#ff8d91}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.chip{background:var(--card2);padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:12px;margin:12px 0}
.ex-title{font-weight:700;font-size:17px;color:var(--blue);display:flex;align-items:center;gap:8px}
.ex-title .dot{width:10px;height:10px;border-radius:50%;flex:none}
.ex-note{font-size:13px;color:var(--muted);margin:4px 0 8px;line-height:1.35}
.ex-target{font-size:13px;color:var(--gold);margin:2px 0 6px;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-size:13px;color:var(--text);font-weight:700;text-align:center;padding:0 2px}
th:first-child,td:first-child{width:38px}
td{text-align:center;padding:0 2px}
.setno{background:var(--card2);border-radius:8px;height:38px;line-height:38px;font-weight:700}
.prev{color:var(--muted);font-size:13px;white-space:nowrap}
.cell{width:100%;height:38px;border-radius:8px;border:0;background:#14171c;text-align:center;font-weight:700;font-size:17px}
.cell::placeholder{color:#5d6573;font-weight:600}
.chk{width:42px;height:38px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:0 auto}
.chk svg{width:20px;height:20px;stroke:#9aa3b1}
tr.done .chk{background:var(--green)} tr.done .chk svg{stroke:#06210f}
tr.done .cell,tr.done .setno{background:#1f3a2a}
.addset{width:100%;background:var(--card2);border-radius:8px;padding:8px;font-weight:600;font-size:14px;margin-top:2px}
.warm{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#1b1e24;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.tab.on{color:var(--blue)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--blue);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:536px;margin:0 auto}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.over{background:var(--green);color:#06210f}
.sess{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card);margin:8px 0}
.sess .st{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.sess.done .st{background:var(--green);border-color:var(--green);color:#06210f}
.sess.prog .st{border-color:var(--gold);color:var(--gold)}
.sess.next{outline:2px solid var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:42px;border-radius:10px;border:0;background:#14171c;padding:0 10px;font-size:17px;font-weight:700}
.stat{background:var(--card2);border-radius:10px;padding:10px}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
select{background:var(--card2);color:var(--text);border:0;border-radius:10px;padding:10px;font:inherit;width:100%}
.banner{background:#2a2f1e;border:1px solid #5b6130;color:#e9e3a5;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90%}
textarea{width:100%;height:140px;background:#14171c;color:var(--text);border:0;border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,monospace}
svg.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.setno.w{color:#f0a35a;background:#3a2d22}
.setno.prset{background:var(--gold);color:#2a2000;font-size:13px}
tr.wu .cell{font-size:15px;color:var(--muted)}
.prb{display:inline-block;background:var(--gold);color:#2a2000;font-size:10px;font-weight:800;border-radius:5px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.ex-title{cursor:pointer}
.ex-tools{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.mini{background:var(--card2);color:var(--muted);font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px}
.mynote{background:#1d2a3a;border-left:3px solid var(--blue);border-radius:6px;padding:6px 8px;font-size:13px;margin:4px 0 6px;white-space:pre-wrap}
.sheet-bg{position:fixed;inset:0;background:#0009;z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.plates{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}
.plate{border-radius:6px;color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;width:34px}
.feel{display:flex;gap:6px}
.feel button{flex:1;background:var(--card2);border-radius:10px;padding:10px 0;font-weight:700}
.feel button.on{background:var(--blue);color:#fff}
.timer .t{font-size:34px}
.timer{padding:14px 16px}
.nextbar{position:fixed;left:0;right:0;z-index:70;display:none;justify-content:flex-end;gap:8px;padding:6px 10px;background:#2b3039;border-top:1px solid var(--line)}
.nextbar.show{display:flex}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<div class="timer" id="timer">
  <div><div class="small" style="opacity:.85">Rest</div><div class="t" id="timerT">0:00</div></div>
  <div class="spacer"></div>
  <button class="btn sm" style="background:#ffffff33" onclick="Timer.add(-30)">−30</button>
  <button class="btn sm" style="background:#ffffff33" onclick="Timer.add(30)">+30</button>
  <button class="btn sm" style="background:#ffffff33" onclick="Timer.stop()">Skip</button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="nextbar" id="nextbar"><button class="btn sm" onmousedown="event.preventDefault()" onclick="document.activeElement&&document.activeElement.blur()">Done</button><button class="btn sm blue" onmousedown="event.preventDefault()" onclick="focusNext()">Next ›</button></div>
<nav class="tabbar" id="tabbar"></nav>

<script>
"use strict";
/* =========================================================
   PROGRAM DEFINITION
   Weight system copied from the old program:
   - Week 2 rep-max tests set the max: weight x (1 + (reps+1)/30), rounded to 5
   - Projected maxes: incline = 88.9% of paused bench, close-grip = 107.4% of paused bench
     (same ratios as the old program: 240/270 and 290/270), each adjustable +/-%
   - Weight = % x max, rounded to 5 lb
   - Back-off = 90% of top set, fatigue drop = 95% of back-off
   - Front squat backdowns 95% / 90% of top set
   - Week 6 front squat 8RM re-test drives weeks 7-9 (old program re-tested its secondary squat mid-block)
   - RDL backdowns fixed at 68% of max
   - Week 10 re-test sets maxes for the next block
   ========================================================= */
const ACC={1:'4 RIR',2:'3 RIR',3:'3 RIR',4:'2 RIR',5:'2 RIR',6:'3 RIR',7:'2 RIR',8:'2 RIR',9:'1 RIR',10:'3 RIR'};
const ISO={1:'3 RIR',2:'2 RIR',3:'2 RIR',4:'2 RIR',5:'1 RIR',6:'2 RIR',7:'2 RIR',8:'1 RIR',9:'1 RIR',10:'3 RIR'};
const WU_UP='Warm-up: 5 min bike + shoulder dislocates, band pull-aparts, thoracic roll';
const WU_LO='Warm-up: 5 min bike + hip flexion/rotation, banded glute walks, bird dogs';
const ns=(w,n,sec)=>w===1?Math.max(2,n-1):(w===10&&sec?1:n);
const R=v=>({t:'rir',v}), P=(lift,p)=>({t:'pct',lift,p}), REL=(ref,f)=>({t:'rel',ref,f}), T=key=>({t:'test',key}), F8=p=>({t:'f8',p});
const E=(id,name,cat,load,sets,reps,note,main)=>({id,name,cat,load,sets,reps,note:note||'',main:!!main});
const WU=t=>({id:'wu',name:t,warm:true});
const pc=p=>Math.round(p*100)+'%';

function day1(w){
  const r=[WU(WU_UP),E('curl_db','DB Preacher Curl','',R(ISO[w]),ns(w,4),8,'Over the incline bench back. Superset with your bench warm-up sets.')];
  if(w===1) r.push(E('pbench','3-Count Paused Bench','bench',R('4 RIR'),3,8,'Pick a weight that leaves 4 reps in reserve.',1));
  else if(w===2) r.push(E('pbench','3-Count Paused Bench — TEST','bench',T('bench'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your bench max.',1),
                        E('pbench_bo','Paused Bench Back-offs','bench',REL('pbench',.85),2,6,'85% of your test weight.'));
  else if(w===10) r.push(E('pbench','3-Count Paused Bench — RE-TEST','bench',T('bench_rt'),1,'3–5','Work up to a hard set of 3–5. Stop with 1 rep left. This sets next block\'s max.',1));
  else{const [p,s,rp]={3:[.75,3,7],4:[.75,4,7],5:[.75,5,7],6:[.80,3,5],7:[.80,4,5],8:[.80,5,5],9:[.85,3,3]}[w];
       r.push(E('pbench','3-Count Paused Bench @ '+pc(p),'bench',P('bench',p),s,rp,'3-second pause on the chest every rep.',1));}
  r.push(E('row_cable','Cable Seated Row','',R(w===1?'4 RIR':ACC[w]),ns(w,3),12,'Superset with your paused bench sets.'));
  if(w===1) r.push(E('cgb','Close-Grip Bench','bench',R('4 RIR'),2,8,'Replaces dips.'));
  else if(w===10) r.push(E('cgb','Close-Grip Bench','bench',R('3 RIR'),2,8,'Replaces dips.'));
  else{const [p,rp]={2:[.70,'8,8,8'],3:[.72,'8,7,7'],4:[.72,'8,8,7'],5:[.72,'8,8,8+'],6:[.75,'7,7,7'],7:[.75,'8,7,6'],8:[.75,'8,8,7'],9:[.78,'6,6,6']}[w];
       r.push(E('cgb','Close-Grip Bench @ '+pc(p),'bench',P('cgb',p),3,rp,'Same weight all 3 sets — beat the reps. Replaces dips.'));}
  r.push(E('sapd','Cable Straight-Arm Pulldown','',R(ISO[w]),ns(w,3),12,'Superset with rear delt fly.'));
  r.push(E('rdfly','Cable Rear Delt Fly','',R(ISO[w]),ns(w,3),12,''));
  r.push(E('pushdown','Cable Triceps Pushdown (optional)','bench',R(ISO[w]),3,10,w===6?'Pick a new grip or attachment.':'Up to 3 sets.'));
  return r;
}
function day2(w){
  const r=[WU(WU_LO)];
  const tempo=(w>=6&&w<=8)?' (3 sec lowering)':'';
  if(w===1) r.push(E('rdl','Romanian Deadlift','hinge',R('4 RIR'),3,8,'Leave 4 reps in reserve. End the set if you feel it in your low back instead of your hamstrings.',1));
  else if(w===2) r.push(E('rdl','Romanian Deadlift — TEST','hinge',T('rdl'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your RDL max.',1),
                        E('rdl_bo','RDL Back-offs','hinge',REL('rdl',.85),2,7,'85% of your test weight.'));
  else if(w===10) r.push(E('rdl','Romanian Deadlift — RE-TEST','hinge',T('rdl_rt'),1,'3–5','Work up to a hard set of 3–5. Stop with 1 rep left. This sets next block\'s max.',1));
  else{const [p,rp,bs,br]={3:[.75,8,2,7],4:[.77,8,3,7],5:[.77,8,4,7],6:[.75,8,2,7],7:[.77,8,3,7],8:[.77,8,4,7],9:[.80,6,2,6]}[w];
       r.push(E('rdl','RDL Top Set @ '+pc(p)+tempo,'hinge',P('rdl',p),1,rp,'Brace hard. Stop if it moves to your low back.',1),
              E('rdl_back','RDL Backdowns @ 68%'+tempo,'hinge',P('rdl',.68),bs,br,'Fixed at 68% of your max, like the old program.'));}
  r.push(E('dbsquat','Heel-Elevated DB Squat or Goblet Squat','squat',R(ACC[w]),ns(w,3),w<6?10:8,w===6?'Switch to the other variation this block.':'DBs at your sides or one at your chest.'));
  r.push(E('pullup','Pull-ups','',R(ACC[w]),ns(w,3),'6–10','Leave weight blank for bodyweight. If you add weight later, enter only the added weight.'));
  r.push(E('hamcurl','Cable Hamstring Curl (ankle strap)','hinge',R(ISO[w]),ns(w,3),w<6?15:12,'Superset with shrugs.'));
  r.push(E('shrug','DB Shrugs','',R((w===1||w===10)?'3 RIR':'1 RIR'),ns(w,3),w<7?12:10,''));
  return r;
}
function day3(w){
  const r=[WU(WU_UP),E('bbcurl','Barbell Curl','',R(w>1?'2 RIR':'3 RIR'),ns(w,4,1),(w>=6&&w<=8)?8:10,'Superset with your bench warm-up sets to warm the elbows.')];
  if(w===1) r.push(E('incl_top','T-Shirt Touch Slight Incline Bench','bench',R('4 RIR'),3,8,'Pick a weight that leaves 4 reps in reserve.',1));
  else if(w===2) r.push(E('incl_top','Slight Incline Bench @ 75%','bench',P('incline',.75),3,6,'Calculated from Monday\'s bench test.',1));
  else if(w===10) r.push(E('incl_top','Slight Incline Bench @ 70% (deload)','bench',P('incline',.70),1,6,'Easy week.',1));
  else{const p={3:.80,4:.83,5:.85,6:.78,7:.80,8:.83,9:.80}[w];
       const tt=(w>=6&&w<=8)?' — 3s lower, 1s hold at top':(w===9?' — 3s lower, 3s pause':'');
       const tb=(w>=6&&w<=8)?' — 3s lower':'';
       r.push(E('incl_top','Incline Top Set @ '+pc(p)+tt,'bench',P('incline',p),1,5,'T-shirt touch. One hard set of 5.',1),
              E('incl_back','Incline Back-offs @ 90% of top'+tb,'bench',REL('incl_top',.90),3,6,'If a set hits RPE 9+, drop to {drop} lb for the rest of the sets.'));}
  r.push(E('latpd','Cable Lat Pulldown','',R(ACC[w]),ns(w,4,1),(w>=6&&w<=8)?10:12,w===7?'Choose a new bar or grip.':'Kneeling or seated.'));
  r.push(E('dbohp',((w===7||w===8)?'Paused ':'')+'Seated DB Overhead Press','ohp',R(ACC[w]),ns(w,3,1),(w>=6&&w<=8)?10:12,'Weight = one dumbbell. Superset with wrist curls.'));
  const seq={1:1,2:2,3:2,4:3,5:3,6:1,7:2,8:3,9:3,10:1}[w];
  r.push(E('lateral',((w===7||w===8)?'Lu Raise':'DB Lateral Raise')+' Myoreps','ohp',R((w===1||w===6||w===10)?'3 RIR':'1 RIR'),seq,'12+6+3','Each row = one myorep sequence: 12 reps, rest 4 sec, 6 reps, rest 4 sec, 3+ reps. Log total reps.'));
  r.push(E('csrow','Chest-Supported DB Row'+((w===7||w===8)?' (slow lowering)':''),'',R(ACC[w]),ns(w,4,1),10,'Chest on the incline bench. Weight = one dumbbell.'));
  return r;
}
function day4(w){
  const r=[WU(WU_LO)];
  const tempo=(w>=6&&w<=8)?' (3 sec lowering)':'';
  if(w===1) r.push(E('fsq_top','Front Squat','squat',R('4 RIR'),3,8,'Leave 4 reps in reserve. Heavy DB squat is fine if front squats bother your back.',1));
  else if(w===2) r.push(E('fsq_top','Front Squat — TEST','squat',T('front'),1,'5–8','Work up to your heaviest set of 5–8. Stop with 1 rep left. Logging it sets your front squat max.',1),
                        E('fsq_bo','Front Squat Back-offs','squat',REL('fsq_top',.85),2,8,'85% of your test weight.'));
  else if(w===10) r.push(E('fsq_top','Front Squat @ 65% (deload)','squat',P('front',.65),1,8,'Easy week.',1));
  else if(w===6) r.push(E('fsq_top','Front Squat — 8 REP MAX RE-TEST','squat',T('front8'),1,8,'Ramp up to your heaviest clean set of 8. This sets weeks 7–9.',1),
                        E('fsq_bd2','Front Squat Backdown 2 (90%)','squat',REL('fsq_top',.90),1,8,''),
                        E('fsq_bd3','Front Squat Backdown 3 (86%)','squat',REL('fsq_top',.86),1,8,''));
  else if(w>=7){const p={7:.90,8:.94,9:.96}[w], rp=w===9?6:8;
       r.push(E('fsq_top','Front Squat Top Set @ '+pc(p)+' of 8RM'+tempo,'squat',F8(p),1,rp,'Calculated from your week 6 re-test.',1),
              E('fsq_bd2','Front Squat Backdown 2 (95%)'+tempo,'squat',REL('fsq_top',.95),1,rp,''),
              E('fsq_bd3','Front Squat Backdown 3 (90%)'+tempo,'squat',REL('fsq_top',.90),1,rp,''));}
  else{const p={3:.70,4:.72,5:.74}[w];
       r.push(E('fsq_top','Front Squat Top Set @ '+pc(p),'squat',P('front',p),1,8,'',1),
              E('fsq_bd2','Front Squat Backdown 2 (95%)','squat',REL('fsq_top',.95),1,8,''),
              E('fsq_bd3','Front Squat Backdown 3 (90%)','squat',REL('fsq_top',.90),1,8,''));}
  r.push(E('pullthru','Cable Pull-Through','hinge',R(ACC[w]),ns(w,3,1),12,'Replaces good mornings — easy on the low back.'));
  r.push(E('split','DB Split Squat'+((w===7||w===8)?' (slow lowering)':''),'squat',R(ACC[w]),ns(w,3,1),'10/leg','Rear foot elevated if comfortable. Weight = one dumbbell.'));
  r.push(E('crunch','Cable Crunch','',R(w>1?'0 RIR':'2 RIR'),ns(w,2,1),15,w===6?'Pick a new ab exercise. Superset with wrist extensions.':'Superset with wrist extensions.'));
  r.push(E('deadbug','Dead Bug','',R('Slow'),ns(w,2,1),'10/side','Low back pressed into the floor.'));
  r.push(E('kbswing','KB Swings (optional finisher)','hinge',{t:'fixed',v:35},ns(w,3,1),15,'Or 5 minutes of bike intervals.'));
  return r;
}
function travelDay(fn){ // repeat Week 1 day at 3 RIR
  return fn(1).map(e=>{if(e.warm)return e; const c={...e,load:{...e.load}}; if(c.load.t==='rir'&&c.load.v==='4 RIR')c.load.v='3 RIR'; return c;});
}
const tripA=()=>[WU('No equipment. About 30 minutes.'),
  E('t_pushup','Push-ups','bench',R('2 RIR'),4,'AMRAP',''),E('t_bss','Bulgarian Split Squat (foot on bed/chair)','squat',R('2 RIR'),3,'12/leg',''),
  E('t_pike','Pike Push-ups','ohp',R('2 RIR'),3,'8–10',''),E('t_bridge','Single-Leg Glute Bridge','hinge',R('2 RIR'),3,'12/leg',''),
  E('t_towel','Towel Row (around a door handle)','',R('2 RIR'),3,12,''),E('t_deadbug','Dead Bug','',R('Slow'),3,'10/side','')];
const tripB=()=>[WU('No equipment. About 30 minutes.'),
  E('t_decline','Decline Push-ups (feet on bed)','bench',R('2 RIR'),3,'AMRAP',''),E('t_lunge','Reverse Lunges','squat',R('2 RIR'),3,'12/leg',''),
  E('t_slrdl','Single-Leg RDL (bodyweight, slow)','hinge',R('Slow'),3,'10/leg',''),E('t_diamond','Close-Grip / Diamond Push-ups','bench',R('2 RIR'),3,'AMRAP',''),
  E('t_birddog','Bird Dog','',R('Slow'),3,'10/side',''),E('t_sideplank','Side Plank','',R('Hold'),2,'30s/side','')];

const DAYNAMES=['Day 1 — Primary Upper','Day 2 — Primary Lower','Day 3 — Secondary Upper','Day 4 — Secondary Lower'];
const FNS=[day1,day2,day3,day4];

const r5=x=>Math.round(x/5)*5;
const epley=(w,r)=>w*(1+r/30);
function testE1(t){return t?r5(epley(t.w,t.r+1)):null}
function maxes(){
  const m=S.maxes, a=m.adj;
  const b=testE1(m.tests.bench)||m.start.bench, rd=testE1(m.tests.rdl)||m.start.rdl, fr=testE1(m.tests.front)||m.start.front;
  const out={bench:r5(b*a.bench/100),incline:r5(b*0.889*a.incline/100),cgb:r5(b*1.074*a.cgb/100),rdl:r5(rd*a.rdl/100),front:r5(fr*a.front/100)};
  out.front8=m.front8||r5(out.front/(1+9/30));
  out.src={bench:m.tests.bench?'Week 2 test':'starting estimate',rdl:m.tests.rdl?'Week 2 test':'starting estimate',front:m.tests.front?'Week 2 test':'starting estimate',front8:m.front8?'Week 6 test':'estimated from front squat max'};
  return out;
}
function sess(id){return SESSIONS.find(s=>s.id===id)}
function sidx(id){return SESSIONS.findIndex(s=>s.id===id)}
function log(id){return S.logs[id]}
function exSets(ex){return typeof ex.sets==='number'?ex.sets:3}
function repTarget(ex,i){
  if(typeof ex.reps==='number')return ex.reps;
  const parts=String(ex.reps).split(',');
  if(parts.length>1){const v=parseInt(parts[Math.min(i,parts.length-1)]);return isNaN(v)?null:v}
  const v=parseInt(ex.reps);return (/^\d+$/.test(String(ex.reps)))?v:null;
}
const BARBELL=new Set(['pbench','pbench_bo','cgb','rdl','rdl_bo','rdl_back','incl_top','incl_back','fsq_top','fsq_bo','fsq_bd2','fsq_bd3','bbcurl']);
const swapped=(sid,exid)=>{const L=log(sid);return L&&L.swap&&L.swap[exid]};
// PR map: a set is a PR when its estimated 1RM beats every earlier logged set of that exercise (first-ever log doesn't count)
function prMap(){const best={},pr={},bests={};
  SESSIONS.forEach(s=>{const L=log(s.id);if(!L)return;Object.keys(L.ex).forEach(exid=>{if(swapped(s.id,exid))return;
    L.ex[exid].forEach((x,i)=>{if(!(x.done&&x.w>0&&x.r>0))return;const v=epley(x.w,x.r);
      if(best[exid]!=null&&v>best[exid]+0.01)pr[s.id+'|'+exid+'|'+i]=true;
      if(best[exid]==null||v>best[exid]){best[exid]=v;bests[exid]={w:x.w,r:x.r,e1:Math.round(v),date:L.date||s.date}}})})});
  return {pr,bests};}
function exName(exid){for(const s of SESSIONS){const e=s.ex.find(x=>x.id===exid);if(e)return e.name.replace(/ — .*$/,'').replace(/ @ .*$/,'')}return exid}
function bestSet(sets){let b=null;(sets||[]).forEach(s=>{if(s.done&&s.w>0&&s.r>0){if(!b||epley(s.w,s.r)>epley(b.w,b.r))b=s}});return b}
function targets(s){
  const M=maxes(), t={}, L=log(s.id)||{ex:{}};
  s.ex.forEach(e=>{
    if(e.warm)return; if(L.swap&&L.swap[e.id]){t[e.id]=null;return} const ld=e.load; let v=null;
    if(ld.t==='pct')v=r5(M[ld.lift]*ld.p);
    else if(ld.t==='f8')v=r5(M.front8*ld.p);
    else if(ld.t==='fixed')v=ld.v;
    else if(ld.t==='rel'){let base=t[ld.ref]; if(base==null){const b=bestSet((L.ex[ld.ref]||[]));base=b?b.w:null} v=base!=null?r5(base*ld.f):null}
    else if(ld.t==='test'){const b=bestSet(L.ex[e.id]);v=null;t[e.id]=b?b.w:null;return}
    t[e.id]=v;
  });
  return t;
}
function previous(sid,exid){
  const i=sidx(sid);
  for(let k=i-1;k>=0;k--){const L=log(SESSIONS[k].id);if(L&&L.ex[exid]&&L.ex[exid].some(x=>x.done))return L.ex[exid]}
  return null;
}
function sessionStatus(id){const L=log(id);if(!L)return 'todo';if(L.finished)return 'done';const any=Object.values(L.ex||{}).some(a=>a.some(x=>x.done));return any?'prog':'todo'}
function nextSession(){const s=SESSIONS.find(s=>sessionStatus(s.id)!=='done');return s?s.id:SESSIONS[SESSIONS.length-1].id}
function applyTests(s){
  const L=log(s.id); if(!L)return;
  s.ex.forEach(e=>{if(e.load&&e.load.t==='test'&&!(L.swap&&L.swap[e.id])){const b=bestSet(L.ex[e.id]);const k=e.load.key;
    if(k==='front8'){S.maxes.front8=b?r5(epley(b.w,b.r)/(1+8/30)):null}
    else if(k.endsWith('_rt')){if(b)S.maxes.retest[k.replace('_rt','')]=r5(epley(b.w,b.r+1));else delete S.maxes.retest[k.replace('_rt','')]}
    else{S.maxes.tests[k]=b?{w:b.w,r:b.r,date:L.date||s.date}:undefined; if(!b)delete S.maxes.tests[k]}}});
}

let AC=null;
function unlockAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{unlockAudio();if(!AC)return;[0,0.35,0.7].forEach(off=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(0.0001,AC.currentTime+off);g.gain.exponentialRampToValueAtTime(0.4,AC.currentTime+off+0.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+off+0.25);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+off);o.stop(AC.currentTime+off+0.3)});if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
const Timer={end:0,iv:null,rang:false,
  start(sec){this.end=Date.now()+sec*1000;this.rang=false;$('timer').classList.add('show');$('timer').classList.remove('over');this.tick();clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),250)},
  add(s){if(!this.end)return;this.end+=s*1000;if(this.end>Date.now()){this.rang=false;$('timer').classList.remove('over')}this.tick()},
  stop(){clearInterval(this.iv);this.end=0;$('timer').classList.remove('show')},
  tick(){if(!this.end)return;const left=Math.round((this.end-Date.now())/1000);const a=Math.abs(left);$('timerT').textContent=(left<0?'+':'')+Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
    if(left<=0){$('timer').classList.add('over');if(!this.rang&&document.visibilityState==='visible'){this.rang=true;beep()}} if(left<-120)this.stop()}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Timer.end){if(Date.now()>=Timer.end&&!Timer.rang){Timer.rang=true;beep();toast('Rest is over — next set!')}Timer.tick()}});

/* Plate calculator */
const PLATES=[45,35,25,10,5,2.5];
const PCOL={45:'#e5484d',35:'#f5c542',25:'#3fcf7a',10:'#e8edf2',5:'#4f9dff',2.5:'#b18cff'};
function platesFor(w){let side=(w-S.bar)/2;const out=[];if(side<0)return null;for(const p of PLATES){while(side>=p-1e-9){out.push(p);side-=p}}return {out,left:Math.round(side*100)/100}}
function plateHtml(w){const r=platesFor(w);if(!r)return `<div class="muted">Less than the ${S.bar} lb bar.</div>`;
  const vis=r.out.map(p=>`<div class="plate" style="background:${PCOL[p]};height:${40+p}px">${p}</div>`).join('');
  return `<div style="text-align:center;font-size:28px;font-weight:800">${w} lb</div><div class="muted small" style="text-align:center">${S.bar} lb bar + each side:</div>
    <div class="plates">${vis||'<span class="muted">Just the bar</span>'}</div><div style="text-align:center;font-weight:700">${r.out.length?r.out.join(' + ')+' per side':'Empty bar'}</div>
    ${r.left?`<div class="muted small" style="text-align:center">(${r.left} lb per side can't be made with standard plates)</div>`:''}`}
function showPlates(w){openSheet(`<h2 style="margin-top:0">Plate calculator</h2><div id="plOut">${plateHtml(w||S.bar)}</div>
  <div class="grid2" style="margin-top:12px"><div class="field"><label>Weight (lb)</label><input inputmode="decimal" value="${w||''}" oninput="const v=parseFloat(this.value);if(v)$('plOut').innerHTML=plateHtml(v)"></div>
  <div class="field"><label>Bar weight (lb)</label><input inputmode="decimal" value="${S.bar}" onchange="const v=parseFloat(this.value);if(v>0){S.bar=v;save();toast('Bar set to '+v+' lb')}"></div></div>`)}

/* Exercise history */
function showHistory(exid){const {pr}=prMap();let rows='';
  SESSIONS.forEach(s=>{const L=log(s.id);if(!L||!L.ex[exid])return;const d=L.ex[exid].map((x,i)=>({x,i})).filter(o=>o.x.done);if(!d.length)return;
    const b=bestSet(L.ex[exid]);const sw=swapped(s.id,exid);
    rows+=`<div class="card" style="margin:8px 0"><div class="row"><div style="font-weight:700">${fmtDate(L.date||s.date)}</div><div class="spacer"></div><div class="muted small">${esc(s.wlabel)}</div></div>
      ${sw?`<div class="muted small">Swapped to ${esc(sw)}</div>`:''}
      <div style="margin-top:4px">${d.map(o=>`${o.x.w?o.x.w:'BW'} × ${o.x.r}${pr[s.id+'|'+exid+'|'+o.i]?'<span class="prb">PR</span>':''}`).join(' · ')}</div>
      ${b&&!sw?`<div class="muted small">Best est. 1RM: ${Math.round(epley(b.w,b.r))} lb</div>`:''}</div>`});
  openSheet(`<h2 style="margin-top:0">${esc(exName(exid))}</h2>${S.notes[exid]?`<div class="mynote">${esc(S.notes[exid])}</div>`:''}${rows||'<div class="muted">No sets logged yet.</div>'}`)}

/* Swap */
function swapEx(exid){const s=sess(S.cur),L=ensureLog(s);L.swap=L.swap||{};
  if(L.swap[exid]){if(!confirm('Undo the swap and go back to '+exName(exid)+'?'))return;delete L.swap[exid];applyTests(s);save();vWorkoutKeep();return}
  const v=prompt('Swap '+exName(exid)+' for which exercise today?','');if(!v||!v.trim())return;L.swap[exid]=v.trim();applyTests(s);save();vWorkoutKeep();toast('Swapped for today only')}

function vWorkout(){
  if(!S.cur)S.cur=nextSession();
  const s=sess(S.cur), L=log(s.id), t=targets(s), st=sessionStatus(s.id);
  let elapsed='';if(L&&L.start){const mins=Math.round(((L.end||Date.now())-L.start)/60000);elapsed=Math.floor(mins/60)+':'+String(mins%60).padStart(2,'0')}
  let h=`<div class="row" style="margin-top:4px"><button class="chip" onclick="go('plan')">‹ ${esc(s.wlabel)}</button><div class="spacer"></div>
    ${st==='done'?'<span class="chip" style="color:var(--green)">Finished ✓</span>':`<button class="btn primary" onclick="finish()">Finish</button>`}</div>
    <h1>${esc(s.name)}</h1><div class="muted small">${fmtDate(s.date)}${L&&L.date&&L.date!==s.date?' · done '+fmtDate(L.date):''}${elapsed?' · ⏱ '+elapsed:''}</div>`;
  if(s.id==='w2d1'||s.id==='w2d2'||s.id==='w2d4')h+=`<div class="banner">Test day. Log your heaviest set honestly — it sets the weights for the rest of the program.</div>`;
  if(s.week===10)h+=`<div class="banner">Last week! When you're done, go to Export and send the file to Claude to build your next block.</div>`;
  if(needsBackup())h+=`<div class="banner">It's been over 2 weeks since your last backup. <button class="btn sm blue" style="margin-left:6px" onclick="go('more')">Back up now</button></div>`;
  const PRS=prMap().pr;
  s.ex.forEach(e=>{
    if(e.warm){h+=`<div class="card warm">${esc(e.name)}</div>`;return}
    const sets=(L&&L.ex[e.id])||[], prev=previous(s.id,e.id), n=Math.max(exSets(e),sets.length);
    const tw=t[e.id], sw=L&&L.swap&&L.swap[e.id];
    let tgt=e.load.t==='rir'?`Target: ${esc(e.load.v)} · ${esc(e.reps)} reps`:e.load.t==='test'?`Target: heaviest set of ${esc(e.reps)} (1 rep left)`:(tw!=null?`Target: ${tw} lb × ${esc(e.reps)}`:'Target: log the set above first');
    if(e.load.t==='fixed')tgt=`Target: ${tw} lb × ${esc(e.reps)}`;
    if(sw)tgt=`Swapped today — pick a weight for ${esc(e.reps)} reps`;
    let note=e.note; if(note.includes('{drop}'))note=note.replace('{drop}',tw!=null?r5(tw*0.95):'95% of back-off');
    const bar=BARBELL.has(e.id)&&!sw;
    h+=`<div class="card"><div class="ex-title" onclick="showHistory('${e.id}')"><span class="dot" style="background:${catColor(e.cat)}"></span>${sw?esc(sw)+' <span class="muted small">(instead of '+esc(e.name)+')</span>':esc(e.name)} <span class="muted small">›</span></div>
      <div class="ex-target">${tgt}</div>${note&&!sw?`<div class="ex-note">${esc(note)}</div>`:''}
      ${S.notes[e.id]?`<div class="mynote" onclick="editNote('${e.id}')">${esc(S.notes[e.id])}</div>`:''}
      <div class="ex-tools">${bar?`<button class="mini" onclick="showPlates(${tw!=null?tw:(sets[0]&&sets[0].w)||(prev&&prev[0]&&prev[0].w)||0})">Plates</button>`:''}
        <button class="mini" onclick="editNote('${e.id}')">${S.notes[e.id]?'Edit note':'+ Note'}</button>
        <button class="mini" onclick="swapEx('${e.id}')">${sw?'Undo swap':'Swap'}</button>
        <button class="mini" onclick="showHistory('${e.id}')">History</button></div>
      <table><tr><th>Set</th><th>Previous</th><th>lbs</th><th>Reps</th><th style="width:48px">✓</th></tr>`;
    // Warm-up sets for main barbell lifts: bar x8, 50% x5, 70% x3, 85% x1 of the first work set
    if(bar&&e.main){const work=tw!=null?tw:((sets[0]&&sets[0].w)||(prev&&prev[0]&&prev[0].w)||null);
      if(work&&work>S.bar){const wu=[[S.bar,8],[Math.max(S.bar,r5(work*.5)),5],[Math.max(S.bar,r5(work*.7)),3],[Math.max(S.bar,r5(work*.85)),1]].filter((x,k,a)=>k===0||x[0]>a[k-1][0]);
        const wd=(L&&L.wu&&L.wu[e.id])||[];
        wu.forEach(([ww,rr],k)=>{h+=`<tr class="wu ${wd[k]?'done':''}"><td><div class="setno w">W</div></td><td class="prev">warm-up</td>
          <td><div class="cell" style="line-height:38px" onclick="showPlates(${ww})">${ww}</div></td><td><div class="cell" style="line-height:38px">${rr}</div></td>
          <td><button class="chk" onclick="toggleWU('${e.id}',${k})">${CHECK}</button></td></tr>`})}}
    for(let i=0;i<n;i++){
      const x=sets[i]||{}, p=prev&&prev[i];
      const phW=tw!=null?tw:(p&&p.w!=null?p.w:(e.id==='pullup'||e.id.startsWith('t_')?'BW':'')), phR=repTarget(e,i)??(p?p.r:'');
      h+=`<tr class="${x.done?'done':''}"><td><button class="setno${PRS[s.id+'|'+e.id+'|'+i]?' prset':''}" style="width:100%" onclick="delSet('${e.id}',${i})">${PRS[s.id+'|'+e.id+'|'+i]?'PR':i+1}</button></td>
        <td class="prev">${p&&p.done?(p.w?p.w+' × ':'BW × ')+p.r:'—'}</td>
        <td><input class="cell" enterkeyhint="next" inputmode="decimal" value="${x.w??''}" placeholder="${esc(phW)}" onchange="setVal('${e.id}',${i},'w',this.value)"></td>
        <td><input class="cell" enterkeyhint="next" inputmode="numeric" value="${x.r??''}" placeholder="${esc(phR)}" onchange="setVal('${e.id}',${i},'r',this.value)"></td>
        <td><button class="chk" onclick="toggle('${e.id}',${i})">${CHECK}</button></td></tr>`;
    }
    h+=`</table><button class="addset" onclick="addSet('${e.id}')">+ Add Set</button><div class="muted small" style="text-align:center;margin-top:6px">Tap a set number to delete or clear it</div></div>`;
  });
  const fl=L&&L.feel;
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:8px">How did today feel?</div>
    <div class="feel">${[1,2,3,4,5].map(n=>`<button class="${fl===n?'on':''}" onclick="setFeel(${n})">${n}</button>`).join('')}</div>
    <div class="muted small" style="margin:6px 0 10px">1 = drained · 3 = normal · 5 = great</div>
    <textarea style="height:70px;font:15px -apple-system,Arial" placeholder="Notes: sleep, energy, low back, anything off…" onchange="setSessNote(this.value)">${esc((L&&L.note)||'')}</textarea></div>`;
  h+=`<div class="row" style="margin:16px 0"><button class="btn" onclick="moveSess(-1)">‹ Previous day</button><div class="spacer"></div><button class="btn" onclick="moveSess(1)">Next day ›</button></div>`;
  $('view').innerHTML=h;
}
function ensureLog(s){if(!S.logs[s.id])S.logs[s.id]={ex:{},start:null,end:null,date:null,finished:false};return S.logs[s.id]}
function setVal(exid,i,k,v){const s=sess(S.cur),L=ensureLog(s);const a=L.ex[exid]||(L.ex[exid]=[]);while(a.length<=i)a.push({});
  const n=v===''?null:parseFloat(v);a[i][k]=isNaN(n)?null:n;
  if(a[i].done){applyTests(s);}save();}
function toggle(exid,i){
  const s=sess(S.cur),L=ensureLog(s),e=s.ex.find(x=>x.id===exid);const a=L.ex[exid]||(L.ex[exid]=[]);while(a.length<=i)a.push({});
  const x=a[i];
  if(!x.done){
    const t=targets(s),prev=previous(s.id,exid),p=prev&&prev[i];
    if(x.w==null){const tw=t[exid];x.w=tw!=null?tw:(p&&p.w!=null?p.w:(e.id==='pullup'||e.id.startsWith('t_')?0:null))}
    if(x.r==null){x.r=repTarget(e,i)??(p?p.r:null)}
    if(x.w==null||x.r==null){toast('Enter weight and reps first');save();vWorkout();return}
    x.done=true; if(!L.start)L.start=Date.now(); if(!L.date)L.date=today(); unlockAudio();
    if(prMap().pr[s.id+'|'+exid+'|'+i])setTimeout(()=>toast('New PR! Est. 1RM '+Math.round(epley(x.w,x.r))+' lb'),50);
    Timer.start(e.main?180:(e.id.startsWith('t_')?60:120));
  }else{x.done=false}
  applyTests(s);save();const y=window.scrollY;vWorkout();window.scrollTo(0,y);
}
function toggleWU(exid,k){const s=sess(S.cur),L=ensureLog(s);L.wu=L.wu||{};const a=L.wu[exid]||(L.wu[exid]=[]);a[k]=!a[k];unlockAudio();if(!L.start)L.start=Date.now();if(!L.date)L.date=today();save();vWorkoutKeep();if(a[k])Timer.start(60)}
function delSet(exid,i){
  const s=sess(S.cur),e=s.ex.find(x=>x.id===exid),L=log(s.id),a=(L&&L.ex[exid])||[];
  const extra=i>=exSets(e);
  if(!extra&&!a[i]){toast('Nothing to clear in this set');return}
  if(!confirm(extra?`Delete set ${i+1}?`:`Clear set ${i+1}? (It's part of today's plan, so the empty row stays.)`))return;
  if(extra){if(i<a.length)a.splice(i,1)}else{a[i]={}}
  applyTests(s);save();const y=window.scrollY;vWorkout();window.scrollTo(0,y);toast(extra?'Set deleted':'Set cleared');
}
function addSet(exid){const s=sess(S.cur),L=ensureLog(s),e=s.ex.find(x=>x.id===exid);const a=L.ex[exid]||(L.ex[exid]=[]);while(a.length<Math.max(exSets(e),a.length))a.push({});a.push({});save();const y=window.scrollY;vWorkout();window.scrollTo(0,y)}
function finish(){const s=sess(S.cur),L=ensureLog(s);
  const done=Object.values(L.ex).reduce((n,a)=>n+a.filter(x=>x.done).length,0);
  if(!done&&!confirm('No sets checked. Mark this day finished anyway?'))return;
  L.finished=true;L.end=Date.now();if(!L.date)L.date=today();if(!L.start)L.start=L.end;applyTests(s);Timer.stop();
  const nx=nextSession();S.cur=nx;save();toast('Workout saved ✓ Next: '+sess(nx).name);go('workout');}
function moveSess(d){const i=sidx(S.cur)+d;if(i<0||i>=SESSIONS.length)return;S.cur=SESSIONS[i].id;save();go('workout')}
function openSess(id){S.cur=id;save();go('workout')}

function vPlan(){
  const nx=nextSession();let h=`<h1>Plan</h1><div class="muted small">Tap any day to open it. Blue outline = next up.</div>`;
  let lastW=null;
  SESSIONS.forEach(s=>{
    if(s.wlabel!==lastW){h+=`<h2>${esc(s.wlabel)}</h2>`;lastW=s.wlabel}
    const st=sessionStatus(s.id);
    h+=`<div class="sess ${st} ${s.id===nx?'next':''}" onclick="openSess('${s.id}')"><div class="st">${st==='done'?'✓':st==='prog'?'•':''}</div>
      <div><div style="font-weight:600">${esc(s.name)}</div><div class="muted small">${fmtDate(s.date)}${log(s.id)&&log(s.id).date?' · done '+fmtDate(log(s.id).date):''}</div></div></div>`;
  });
  $('view').innerHTML=h;
}

function lineChart(series,opts){
  // series: [{name,color,pts:[{x:Date ms,y,label}]}]
  const W=340,H=190,pl=38,pr=10,pt=10,pb=26;
  const all=series.flatMap(s=>s.pts);
  if(all.length===0)return `<div class="muted small" style="padding:20px 0;text-align:center">${opts.empty||'No data yet — log some sets.'}</div>`;
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const pad=Math.max(5,(y1-y0)*0.15);y0=Math.floor((y0-pad)/5)*5;y1=y0+Math.max(20,Math.ceil((y1+pad-y0)/20)*20);
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>H-pb-(y-y0)/(y1-y0)*(H-pt-pb);
  let g='';for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#353b46" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  const d1=new Date(x0),d2=new Date(x1);
  g+=`<text x="${pl}" y="${H-6}">${d1.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${d2.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`;
  series.forEach(s=>{if(!s.pts.length)return;const pts=s.pts.slice().sort((a,b)=>a.x-b.x);
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
    if(!s.dash)pts.forEach(p=>g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.5" fill="${s.color}"/>`);});
  const leg=series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${leg}</div>`;
}
function liftHistory(exid){
  const pts=[],tops=[];
  SESSIONS.forEach(s=>{const L=log(s.id);if(!L||!L.ex[exid]||swapped(s.id,exid))return;const b=bestSet(L.ex[exid]);if(!b)return;
    const x=new Date((L.date||s.date)+'T12:00:00').getTime();pts.push({x,y:Math.round(epley(b.w,b.r))});
    const top=Math.max(...L.ex[exid].filter(z=>z.done&&z.w>0).map(z=>z.w));tops.push({x,y:top});});
  return {pts,tops};
}
function vProgress(){
  if(!S.chartLift)S.chartLift='pbench';
  const lift=MAIN_LIFTS.find(l=>l.id===S.chartLift)||MAIN_LIFTS[0];const hh=liftHistory(lift.id);
  let h=`<h1>Progress</h1><div class="card"><select onchange="S.chartLift=this.value;save();vProgress()">${MAIN_LIFTS.map(l=>`<option value="${l.id}" ${l.id===lift.id?'selected':''}>${l.name}</option>`).join('')}</select>
    <div style="margin-top:10px">${lineChart([{name:'Estimated 1RM',color:lift.c,pts:hh.pts},{name:'Heaviest set',color:'#8b93a1',pts:hh.tops,dash:true}],{})}</div>`;
  if(hh.pts.length){const f=hh.pts[0].y,l=hh.pts[hh.pts.length-1].y;h+=`<div class="grid2" style="margin-top:10px"><div class="stat"><div class="v">${l} lb</div><div class="l">Latest est. 1RM</div></div><div class="stat"><div class="v" style="color:${l>=f?'var(--green)':'var(--red)'}">${l-f>=0?'+':''}${l-f} lb</div><div class="l">Since first log</div></div></div>`}
  h+=`</div>`;
  const bw=S.bw.map(b=>({x:new Date(b.d+'T12:00:00').getTime(),y:b.v}));
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Body weight</div>${lineChart([{name:'Body weight (lb)',color:'#c58bff',pts:bw}],{})}</div>`;
  // weekly volume
  const vol={};SESSIONS.forEach(s=>{const L=log(s.id);if(!L)return;let v=0;Object.values(L.ex).forEach(a=>a.forEach(x=>{if(x.done&&x.w>0&&x.r>0)v+=x.w*x.r}));if(v){const k=s.wlabel;vol[k]=(vol[k]||0)+v}});
  const keys=Object.keys(vol);let bars='';
  if(keys.length){const mx=Math.max(...Object.values(vol));bars=keys.map(k=>`<div class="row small" style="margin:4px 0"><div style="width:84px" class="muted">${esc(k.replace('Week ','Wk '))}</div><div style="flex:1;background:#14171c;border-radius:6px;height:16px"><div style="width:${vol[k]/mx*100}%;background:var(--blue);height:16px;border-radius:6px"></div></div><div style="width:70px;text-align:right">${Math.round(vol[k]/1000)}k lb</div></div>`).join('')}
  else bars='<div class="muted small">No data yet.</div>';
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Weekly volume (weight × reps)</div>${bars}</div>`;
  const {bests}=prMap();const ids=Object.keys(bests).sort((a,b)=>bests[b].e1-bests[a].e1);
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Personal records</div>${ids.length?ids.map(id=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)" onclick="showHistory('${id}')"><div style="flex:1"><div style="font-weight:600">${esc(exName(id))}</div><div class="muted small">${bests[id].w?bests[id].w+' lb':'BW'} × ${bests[id].r} · ${fmtDate(bests[id].date)}</div></div><div style="font-weight:800">${bests[id].w?bests[id].e1+' lb':''}</div></div>`).join(''):'<div class="muted small">Log some sets to see your records.</div>'}</div>`;
  const done=SESSIONS.filter(s=>sessionStatus(s.id)==='done').length;
  h+=`<div class="grid2"><div class="stat"><div class="v">${done} / ${SESSIONS.length}</div><div class="l">Workouts finished</div></div><div class="stat"><div class="v">${S.bw.length?S.bw[S.bw.length-1].v:'—'} lb</div><div class="l">Latest body weight</div></div></div>`;
  $('view').innerHTML=h;
}

function vMaxes(){
  const M=maxes(),m=S.maxes;
  const row=(k,label,v,src)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><div style="font-weight:600">${label}</div><div class="muted small">${src}</div></div><div style="font-size:20px;font-weight:800">${v} lb</div></div>`;
  let h=`<h1>Maxes</h1><div class="muted small">Weights in the program are calculated from these. They update automatically when you log a test set.</div>
  <div class="card">${row('bench','3-Count Paused Bench',M.bench,M.src.bench)}${row('incline','Slight Incline Bench',M.incline,'Projected: 88.9% of paused bench')}
  ${row('cgb','Close-Grip Bench',M.cgb,'Projected: 107.4% of paused bench')}${row('rdl','Romanian Deadlift',M.rdl,M.src.rdl)}
  ${row('front','Front Squat',M.front,M.src.front)}${row('front8','Front Squat 8-rep max',M.front8,M.src.front8)}</div>
  <h2>Adjust a max</h2><div class="muted small">If a projected weight feels off, nudge it. 100 = as calculated (the old program said ±10% is normal).</div>
  <div class="card grid2">${[['bench','Paused bench %'],['incline','Incline %'],['cgb','Close-grip %'],['rdl','RDL %'],['front','Front squat %']].map(([k,l])=>`<div class="field"><label>${l}</label><input inputmode="numeric" value="${m.adj[k]}" onchange="setAdj('${k}',this.value)"></div>`).join('')}</div>
  <h2>Starting estimates</h2><div class="muted small">Used only until you log the Week 2 tests.</div>
  <div class="card grid2">${[['bench','Paused bench'],['rdl','RDL'],['front','Front squat']].map(([k,l])=>`<div class="field"><label>${l} (lb)</label><input inputmode="numeric" value="${m.start[k]}" onchange="setStart('${k}',this.value)"></div>`).join('')}</div>
  <h2>Body weight</h2><div class="card"><div class="row"><div class="field" style="flex:1"><label>Today's weight (lb)</label><input id="bwIn" inputmode="decimal" placeholder="${S.bw.length?S.bw[S.bw.length-1].v:''}"></div><button class="btn blue" style="margin-top:18px" onclick="addBW()">Save</button></div>
  <div class="muted small" style="margin-top:8px">Weigh in once a week, same time of day.</div></div>`;
  const rt=m.retest;if(Object.keys(rt).length){h+=`<h2>Next block (Week 10 re-test)</h2><div class="card">${rt.bench?row('','Paused Bench',rt.bench,'Week 10 re-test'):''}${rt.rdl?row('','RDL',rt.rdl,'Week 10 re-test'):''}</div>`}
  $('view').innerHTML=h;
}
function setAdj(k,v){const n=parseFloat(v);if(!isNaN(n)&&n>50&&n<150){S.maxes.adj[k]=n;save();toast('Updated');vMaxes()}}
function setStart(k,v){const n=parseFloat(v);if(!isNaN(n)&&n>0){S.maxes.start[k]=n;save();toast('Updated');vMaxes()}}
function addBW(){const v=parseFloat($('bwIn').value);if(isNaN(v)||v<60||v>500){toast('Enter a weight');return}
  const d=today();const ex=S.bw.find(b=>b.d===d);if(ex)ex.v=v;else S.bw.push({d,v});S.bw.sort((a,b)=>a.d<b.d?-1:1);save();toast('Saved '+v+' lb');vMaxes()}

function buildExport(){
  const M=maxes();
  const sessions=SESSIONS.map(s=>{const L=log(s.id),t=targets(s);
    return {id:s.id,week:s.week,day:s.name,planned_date:s.date,date_done:L&&L.date||null,finished:!!(L&&L.finished),
      duration_min:L&&L.start&&L.end?Math.round((L.end-L.start)/60000):null,
      felt_1to5:L&&L.feel||null,session_note:L&&L.note||'',swaps:L&&L.swap||{},
      exercises:s.ex.filter(e=>!e.warm).map(e=>({id:e.id,name:e.name,prescribed:{load:e.load.t==='rir'?e.load.v:(t[e.id]!=null?t[e.id]+' lb':e.load.t),sets:e.sets,reps:e.reps},
        logged:((L&&L.ex[e.id])||[]).filter(x=>x.done).map(x=>({lb:x.w,reps:x.r}))}))}});
  const summary=MAIN_LIFTS.map(l=>{const hh=liftHistory(l.id).pts;return {lift:l.name,first_e1rm:hh[0]?hh[0].y:null,last_e1rm:hh.length?hh[hh.length-1].y:null,sessions_logged:hh.length}});
  return {app:'Recomp Tracker',format_version:1,exported_at:new Date().toISOString(),
    note:'Upload this file to Claude to review the block and build the next one.',
    maxes_used:{paused_bench:M.bench,incline:M.incline,close_grip:M.cgb,rdl:M.rdl,front_squat:M.front,front_squat_8rm:M.front8},
    exercise_notes:S.notes,personal_records:prMap().bests,
    maxes_inputs:S.maxes,next_block_retest:S.maxes.retest,bodyweight_log:S.bw,lift_summary:summary,
    workouts_finished:SESSIONS.filter(s=>sessionStatus(s.id)==='done').length,sessions,raw_state:S};
}
function fname(){return today()+'-workout-log.json'}
async function shareExport(){S.lastExport=Date.now();save();
  const txt=JSON.stringify(buildExport(),null,1);const file=new File([txt],fname(),{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Workout log'});return}}catch(e){if(e.name==='AbortError')return}
  downloadExport();
}
function downloadExport(){S.lastExport=Date.now();save();const txt=JSON.stringify(buildExport(),null,1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=fname();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function showText(){S.lastExport=Date.now();save();$('expTxt').style.display='block';$('expTxt').value=JSON.stringify(buildExport());$('expTxt').select()}
function importFile(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const st=j.raw_state||j;
  if(!st.logs||!st.maxes)throw new Error('bad');if(!confirm('Replace the data on this phone with this backup?'))return;S=st;S.tab='workout';save();toast('Backup restored');go('workout')}catch(e){toast('That file is not a Recomp Tracker backup')}};rd.readAsText(f);inp.value=''}
function vMore(){
  const done=SESSIONS.filter(s=>sessionStatus(s.id)==='done').length;
  $('view').innerHTML=`<h1>Export</h1>
  <div class="card"><div style="font-weight:700">Send your log to Claude</div><div class="muted small" style="margin:6px 0 10px">Creates one file with every workout, your maxes and body weight. After Week 10, upload it to the chat to build the next block. Also do this every week or two as a backup — deleting the app icon deletes the data on your phone.</div>
  <button class="btn blue" style="width:100%" onclick="shareExport()">Export / Share file</button>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="downloadExport()">Download instead</button><button class="btn sm" onclick="showText()">Show as text</button></div>
  <textarea id="expTxt" style="display:none;margin-top:8px" readonly></textarea></div>
  <div class="card"><div style="font-weight:700">Restore a backup</div><div class="muted small" style="margin:6px 0 10px">Pick a file you exported before (for a new phone, or after reinstalling).</div>
  <input type="file" accept=".json,application/json" onchange="importFile(this)"></div>
  <div class="card small muted">Last backup: ${S.lastExport?new Date(S.lastExport).toLocaleDateString():'never'} · ${done} of ${SESSIONS.length} workouts finished · Data saved on this phone only · Works with no internet once installed.</div>`;
}

/* boot */
renderTabs();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
