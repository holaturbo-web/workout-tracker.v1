}
function mtTodayHtml(){
  const d=mtDay(),s=mtSession(d),L=S.mt[d]||{},isToday=d===today(),w=mtWeek(d);
  let h=`<div class="row" style="margin:10px 0"><button class="btn sm" onclick="mtMove(-1)">‹</button><div style="flex:1;text-align:center;font-family:var(--mono);letter-spacing:1px">${isToday?'TODAY · ':''}${fmtDate(d)}</div><button class="btn sm" onclick="mtMove(1)">›</button></div>`;
  h+=`<div id="rtBox" class="card" style="position:sticky;top:6px;z-index:15;display:none;border:1px solid var(--line)"></div>`;
  const stk=mtStreak();
  h+=`<div class="card"><div class="row" style="gap:8px"><div style="flex:1"><div style="font-weight:700">Morning resting HR</div><div class="muted small">Before getting up, 1 min${mtRhrAvg(d)?' · 7-day avg '+Math.round(mtRhrAvg(d)):''}${stk?` · 🔥 ${stk}-day streak`:''}</div></div>
    <input class="cell" style="width:84px" inputmode="numeric" placeholder="bpm" value="${L.rhr??''}" onchange="mtSet('rhr',this.value)"></div></div>`;
  if(!s){
    if(w<1){const pv=mtSession(mtStart());h+=`<div class="banner">PLAN STARTS ${fmtDate(mtStart()).toUpperCase()} — ${daysBetween(d,mtStart())} days out. Use the arrows to preview Week 1, log resting HR to build a baseline, and rate your skills on PROGRESS to set your starting point.</div>
      <div class="card"><div style="font-weight:700">Week 1 theme: ${esc(pv.theme[0])}</div><div class="muted small" style="margin-top:4px">${esc(pv.theme[1])}</div><div class="small" style="margin-top:6px">Fight to study: <b>${esc(pv.fight[0])}</b> (${esc(pv.fight[1])})</div>
      <button class="btn blue" style="width:100%;margin-top:10px" onclick="MTD='${mtStart()}';vMuay()">Preview Week 1, Day 1 ›</button></div>`}
    else h+=`<div class="banner">12-WEEK PLAN COMPLETE — check PROGRESS, export your data (Export tab) and bring it to Claude to build the next phase.</div>`;
    return h}
  const lf=mtLoadInfo(d),tw=mtTestWeek(d);
  h+=`<div class="card"><div class="serial">MT-W${String(w).padStart(2,'0')}-${['MON','TUE','WED','THU','FRI','SAT','SUN'][s.dow]}<span class="bc" style="width:34px;height:9px"></span></div>
    <div class="row"><div style="flex:1"><div style="font-size:20px;font-weight:800">${esc(s.name)}</div><div class="muted small">Week ${w} of 12 · Block ${s.blk} · ${esc(s.W.wave)} · ${s.high?'HIGH day':s.type==='E'?'Recovery':'Low day'} · target effort ${s.rpe}</div></div>
    ${L.done?'<span class="chip" style="color:var(--green)">Done ✓</span>':''}</div>
    <div class="ex-target" style="margin-top:8px">Theme: ${esc(s.theme[0])}</div><div class="ex-note">${esc(s.theme[1])}</div>
    <div class="small">Fight to study: <b>${esc(s.fight[0])}</b> <span class="muted">(${esc(s.fight[1])})</span>${S.mtFilm[s.fightIdx]?' <span style="color:var(--green)">watched ✓</span>':''}</div></div>`;
  if(s.high&&s.liftDay)h+=`<div class="banner">LIFT DAY TOO — lift first, or strike 3+ hours later.</div>`;
  if(mtRhrAlert(d)&&(s.high||L.swap))h+=`<div class="banner">RECOVERY WARNING — resting HR 5+ bpm above your average two mornings running. ${L.swap?'Swapped to technique today.':`<button class="btn sm blue" style="margin-left:6px" onclick="mtFlag('swap')">Swap to technique</button>`}</div>`;
  if(lf&&lf.over)h+=`<div class="banner">LOAD SPIKE — this week ${lf.cur} vs ${Math.round(lf.avg)} average. Keep the rest of the week easy (stay within +20%).</div>`;
  if((w===5||w===9)&&!MT_GATES[w-1].every((_,i)=>S.mtGate[(w-1)+'_'+i]))h+=`<div class="banner">BLOCK GATE NOT CONFIRMED — tick the week ${w-1} checklist, or repeat the deload week. <button class="btn sm" style="margin-left:6px" onclick="mtRepeatDeload()">Repeat deload</button></div>`;
  if(tw&&s.dow===3)h+=`<div class="banner">TEST WEEK ${tw} — after your hardest round today, log heart rate and rope skips in the test card below.</div>`;
  // steps
  h+=`<div class="card"><div class="row" style="gap:6px;flex-wrap:wrap"><div style="font-weight:700;flex:1">Session</div><button class="mini" onclick="mtCallerToggle()">Caller: ${S.mtCaller===false?'OFF':'ON'}</button>${s.type==='Q'?`<button class="mini" onclick="mtFlag('busy')">Full session</button>`:`<button class="mini" onclick="mtFlag('busy')">Busy day: 15 min</button>`}${L.swap&&!L.busy?`<button class="mini" onclick="mtFlag('swap')">Undo swap</button>`:''}</div>`;
  s.steps.forEach((p,i)=>{const dn=L.steps&&L.steps[i];const tm=p.rounds?(p.rounds>1?`${p.rounds} × ${p.work>=60?(p.work/60)+' min':p.work+' sec'}${p.rest?` / ${p.rest} sec rest`:''}`:(p.work>=60?(p.work/60)+' min':'')):'';
    h+=`<div class="mtstep ${dn?'done':''}"><button class="chk" onclick="mtStep(${i})">${CHECK}</button><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(p.name)} <span class="muted small" style="font-family:var(--mono)">${tm}</span></div>${p.note?`<div class="muted small">${esc(p.note)}</div>`:''}
      ${p.call&&S.mtCaller!==false?'<div class="small" style="color:var(--gold)">🔊 Combo caller calls Ambush numbers in this step</div>':''}
      ${p.name==='Hard kicks'?mtKickHtml(s,L):''}</div>${p.rounds?`<button class="mini" onclick="RT.start(${i})">▶ Timer</button>`:''}</div>`});
  h+=`<div class="row" style="margin-top:8px"><button class="mini" onclick="mtToggleOpen('combos')">${mtOpen.combos?'Hide':'Show'} combo numbers</button></div>${mtOpen.combos?mtCombosHtml():''}`;
  if(s.type==='C'){h+=`<div style="margin-top:10px;font-weight:700">Fault I'm fixing</div><div class="chips">${MT_FAULTS.map((f,i)=>`<button class="mini ${L.fault===i?'on':''}" onclick="mtFault(${i})">${esc(f)}</button>`).join('')}</div>
    <div class="field" style="margin-top:8px"><label>Note on the fix</label><input value="${esc(L.fix||'')}" placeholder="e.g. right hand drops when I kick" onchange="mtFix(this.value)"></div>`}
  h+=`</div>`;
  if(tw)h+=mtTestCardHtml(tw,s.dow===2||s.dow===3);
  // log
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Log</div><div class="grid2">
    <div class="field"><label>Effort 0–10 (30 min after)</label><input id="mtRpe" inputmode="decimal" value="${L.rpe??''}" placeholder="${esc(s.rpe)}" onchange="mtSet('rpe',this.value)"></div>
    <div class="field"><label>Minutes</label><input inputmode="numeric" value="${L.min??''}" placeholder="${s.type==='Q'?15:30}" onchange="mtSet('min',this.value)"></div></div>
    <label class="row small" style="margin-top:10px;gap:8px"><input type="checkbox" ${L.shin?'checked':''} onchange="mtFlag('shin')"> Shin or joint pain from last session still there (halves kicks)</label>
    <div class="muted small" style="margin-top:6px;font-family:var(--mono)">${L.rpe!=null&&L.min?'LOAD '+(L.rpe*L.min)+' · ':''}${lf?'WEEK LOAD '+lf.cur+(lf.avg?' · AVG '+Math.round(lf.avg):''):''}</div>
    ${L.done?'':`<button class="btn primary" style="width:100%;margin-top:10px" onclick="mtFinish()">Finish session</button>`}</div>`;
  if(MT_GATES[w]&&s.dow>=5){h+=`<div class="card"><div style="font-weight:700">Gate to Block ${s.blk+1}</div><div class="muted small" style="margin-bottom:6px">Move up only if both are true. Otherwise repeat this deload week.</div>
    ${MT_GATES[w].map((g,i)=>`<label class="row small" style="gap:8px;padding:4px 0"><input type="checkbox" ${S.mtGate[w+'_'+i]?'checked':''} onchange="mtGate(${w},${i})"> ${esc(g)}</label>`).join('')}
    <button class="btn sm" style="margin-top:6px" onclick="mtRepeatDeload()">Repeat deload week</button></div>`}
  return h}
function mtCombosHtml(){return `<div class="combos">${MT_COMBOS.slice(1).map((c,i)=>`<div><b>${i+1}</b> ${esc(c[0])}<div class="muted small">${esc(c[1])}</div></div>`).join('')}</div><div class="muted small" style="margin-top:4px">Southpaw: jab = right, cross = left. Add a body shot, knee, kick or feint to any number — "3 plus left kick" is the Dutch finish.</div>`}
function mtKickHtml(s,L){const t=s.kicks,kl=L.kl||0,kr=L.kr||0,c=v=>v>t?'var(--red)':v===t?'var(--green)':'#fff';
  return `<div class="row" style="gap:10px;margin-top:6px;flex-wrap:wrap">${[['l','Left',kl],['r','Right',kr]].map(([k,n,v])=>`<div class="row" style="gap:4px"><span class="small muted">${n}</span>
    <button class="mini" onclick="mtKick('${k}',-1)">−</button><b style="font-family:var(--mono);min-width:54px;text-align:center;color:${c(v)}">${v}/${t}</b><button class="mini" onclick="mtKick('${k}',1)">+1</button><button class="mini" onclick="mtKick('${k}',5)">+5</button></div>`).join('')}</div>${L.shin?'<div class="muted small">Halved for shin pain</div>':''}`}
function mtTestCardHtml(w,emph){const T=S.mtTests[w]||{},sc=S.mtScore[w]||{},drop=T.peak&&T.hr1?T.peak-T.hr1:null,base=S.mtTests[1]||{};
  const inp=(k,ph,lab)=>`<div class="field"><label>${lab}</label><input inputmode="numeric" value="${T[k]??''}" placeholder="${ph}" onchange="mtTestSet(${w},'${k}',this.value)"></div>`;
  return `<div class="card" style="${emph?'border:1px solid var(--blue)':''}"><div style="font-weight:700">Test week ${w} · monthly check</div><div class="muted small" style="margin-bottom:6px">Do it on Thursday after your hardest round, or any day this week. Week 1 is your baseline.</div>
    <div class="grid2">${inp('peak','e.g. 175','HR at end of hardest round')}${inp('hr1','e.g. 135','HR 1 min later')}${inp('skips','count','Rope skips in 1 min')}${w===12?inp('sim','0–10','Fight-sim effort (5 × 3)'):''}</div>
    <div class="muted small" style="margin-top:6px;font-family:var(--mono)">7-DAY RESTING HR ${mtRhr7(today())??'—'}${drop!=null?` · RECOVERY DROP ${drop} bpm ${drop>=40?'✓ target 40+':'(target 40+)'}`:''}</div>
    <div style="font-weight:700;margin-top:12px">Video scorecard</div><div class="muted small">Film one full bag round, then rate each check 1–5.</div>
    ${MT_CHECKS.map(([k,l])=>`<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><div class="small" style="flex:1;min-width:140px">${esc(l)}</div><div class="rate">${[1,2,3,4,5].map(n=>`<button class="${sc[k]===n?'on':''}" onclick="mtScoreSet(${w},'${k}',${n})">${n}</button>`).join('')}</div></div>`).join('')}
    ${mtScoreAvg(w)?`<div class="muted small" style="margin-top:6px;font-family:var(--mono)">SCORE ${mtScoreAvg(w).toFixed(1)} / 5${w>1&&mtScoreAvg(1)?` · WEEK 1 ${mtScoreAvg(1).toFixed(1)}`:''}</div>`:''}</div>`}
function mtProgressHtml(){
  const ad=mtAdherence(),stk=mtStreak(),days=Object.keys(S.mt).filter(isDate).sort();
  let h=`<div class="grid2" style="margin-top:10px"><div class="stat"><div class="v">${stk}</div><div class="l">Day streak</div></div><div class="stat"><div class="v">${ad?ad.done+' / '+ad.planned:'—'}</div><div class="l">Sessions done / planned</div></div>
    <div class="stat"><div class="v">${Object.keys(S.mtFilm).length}/${MT_FIGHTS.length}</div><div class="l">Fights studied</div></div><div class="stat"><div class="v">${Math.round(mtSkillAvgOn(today())/3*100)}%</div><div class="l">Curriculum mastered</div></div></div>`;
  // tests table
  const row=(l,f,good)=>{const v=MT_TESTWEEKS.map(w=>f(w));const b=v.find(x=>x!=null);return `<tr><td style="text-align:left">${l}</td>${v.map((x,i)=>`<td>${x==null?'—':x}${i>0&&x!=null&&b!=null&&x!==b&&v.indexOf(b)<i?`<div class="small" style="color:${(x-b)*good>0?'var(--green)':'var(--red)'}">${x-b>0?'+':''}${Math.round((x-b)*10)/10}</div>`:''}</td>`).join('')}</tr>`};
  const wkEnd=w=>addDays(mtStart(),w*7-1);
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Monthly tests</div><table class="ttab"><tr><th style="text-align:left">Test</th>${MT_TESTWEEKS.map(w=>`<th>Wk ${w}</th>`).join('')}</tr>
    ${row('Resting HR (7-day)',w=>mtWeek(today())>=w?mtRhr7(wkEnd(w)<today()?wkEnd(w):today()):null,-1)}
    ${row('HR recovery drop',w=>{const T=S.mtTests[w];return T&&T.peak&&T.hr1?T.peak-T.hr1:null},1)}
    ${row('Rope skips / min',w=>{const T=S.mtTests[w];return T&&T.skips!=null?T.skips:null},1)}
    ${row('Video score /5',w=>{const a=mtScoreAvg(w);return a?Math.round(a*10)/10:null},1)}
    ${row('Fight-sim effort',w=>{const T=S.mtTests[w];return T&&T.sim!=null?T.sim:null},-1)}</table>
    <div class="muted small" style="margin-top:6px">Green = better than your first test. Enter tests on the TODAY screen during weeks 1, 4, 8 and 12.</div></div>`;
  // skill chart + scorecard chart
  const pts=[];const ds=new Set();Object.values(S.mtSkills).forEach(a=>a.forEach(x=>ds.add(x.d)));[...ds].sort().forEach(d=>pts.push({x:new Date(d+'T12:00:00').getTime(),y:Math.round(mtSkillAvgOn(d)*100)/100}));
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Skill level over time</div>${pts.length?lineChart([{name:'Curriculum mastered (% of all skills at Sharp)',color:'#f5d33a',pts:pts.map(p=>({x:p.x,y:Math.round(p.y/3*1000)/10}))}],{}):'<div class="muted small">Rate your skills below to start the chart.</div>'}</div>`;
  // faults
  const fc={};days.forEach(d=>{const f=S.mt[d].fault;if(f!=null)fc[f]=(fc[f]||0)+1});const fk=Object.keys(fc).sort((a,b)=>fc[b]-fc[a]);
  h+=`<div class="card"><div style="font-weight:700;margin-bottom:6px">Faults you've worked on</div>${fk.length?fk.map(k=>`<div class="row small" style="margin:4px 0"><div style="flex:1">${esc(MT_FAULTS[k])}</div><div style="width:40%;background:#14171c;height:12px"><div style="width:${fc[k]/fc[fk[0]]*100}%;background:var(--red);height:12px"></div></div><div style="width:30px;text-align:right">${fc[k]}</div></div>`).join('')+'<div class="muted small" style="margin-top:4px">A fault that keeps coming back is worth a private lesson.</div>':'<div class="muted small">Pick a fault on Film &amp; fix days (Wednesdays).</div>'}</div>`;
  h+=mtCharts(true);
  // skill checklist
  h+=`<h2>Skill checklist <span class="muted small">Ambush Level 1</span></h2><div class="muted small">Tap a level. 0 new · 1 learning · 2 solid · 3 sharp. Re-rate every few weeks; the chart above tracks it. Clinch is partner work — rate it after a class or private.</div>`;
  MT_SKILLS.forEach(([cat,list])=>{const avg=list.reduce((s,n)=>s+mtSkillLevel(cat+'|'+n),0)/list.length;const open=mtOpen['sk_'+cat];
    h+=`<div class="card"><div class="row" onclick="mtToggleOpen('sk_${cat.replace(/'/g,'')}')" style="cursor:pointer"><div style="font-weight:700;flex:1">${esc(cat)}</div><div class="muted small" style="font-family:var(--mono)">${avg.toFixed(1)} / 3 ${open?'▾':'▸'}</div></div>
      <div style="height:6px;background:#14171c;margin-top:6px"><div style="height:6px;width:${avg/3*100}%;background:var(--gold)"></div></div>
      ${open?list.map(n=>{const id=cat+'|'+n,v=mtSkillLevel(id);return `<div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><div class="small" style="flex:1;min-width:120px">${esc(n)}</div><div class="rate">${[0,1,2,3].map(x=>`<button class="${v===x?'on':''}" title="${MT_LEVELS[x]}" onclick="mtRate('${id.replace(/'/g,"\\'")}',${x})">${x}</button>`).join('')}</div></div>`}).join(''):''}</div>`});
  return h}
function mtFilmHtml(){const cat=S.mtFilmCat||'all',n=Object.keys(S.mtFilm).length;
  const weekOf={};for(let w=1;w<=12;w++)weekOf[MT_THEMES[w][2]]=w;
  const list=MT_FIGHTS.map((f,i)=>({f,i})).filter(({f,i})=>cat==='all'||(cat==='todo'?!S.mtFilm[i]:f[3].split(' ').includes(cat)));
  let h=`<div class="card"><div class="row"><div style="font-weight:700;flex:1">Film library</div><div class="muted small" style="font-family:var(--mono)">${n}/${MT_FIGHTS.length} WATCHED</div></div>
    <div style="height:6px;background:#14171c;margin-top:6px"><div style="height:6px;width:${n/MT_FIGHTS.length*100}%;background:var(--green)"></div></div>
    <div class="chips" style="margin-top:8px">${MT_FCATS.map(([k,l])=>`<button class="mini ${cat===k?'on':''}" onclick="mtFilmCat('${k}')">${l}</button>`).join('')}</div>
    <div class="muted small" style="margin-top:6px">Watch once for fun, then again for the "watch for" item only. Rows 1–8 are closest to your build.</div></div>`;
  h+=list.map(({f,i})=>`<div class="card film ${S.mtFilm[i]?'seen':''}"><div class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" style="margin-top:4px;width:20px;height:20px" ${S.mtFilm[i]?'checked':''} onchange="mtFilmToggle(${i})">
    <div style="flex:1;min-width:0"><div style="font-weight:700">${i+1}. ${esc(f[0])}</div><div class="muted small">${esc(f[1])}${weekOf[i]?` · <span style="color:var(--gold)">Week ${weekOf[i]} fight</span>`:''}${f[3].includes('south')?' · southpaw':''}</div>
    <div class="small" style="margin-top:4px">Watch for: ${esc(f[2])}</div>
    <input class="filmnote" placeholder="Your notes…" value="${esc(S.mtFilmNote[i]||'')}" onchange="mtFilmNote(${i},this.value)"></div></div></div>`).join('')||'<div class="muted small">Nothing here.</div>';
  return h+`<div class="muted small" style="margin:10px 0">Analysts: Jack Slack, Lawrence Kenshin, Connor Ruebusch, Sylvie's Muay Thai Library (8limbs.us).</div>`}
function mtPlaybookHtml(){let h=`<div class="card"><div style="font-weight:700">Ambush combo numbers (southpaw)</div>${mtCombosHtml()}</div>
  <div class="muted small" style="margin:6px 0 10px">Coach Jason &amp; Coach Elton's how-tos from the Ambush blog, mirrored for a southpaw. Tap one to open. "Clinch happens": train it every week.</div>`;
  let cat='';MT_BOOK.forEach((b,i)=>{if(b.c!==cat){cat=b.c;h+=`<h2>${esc(cat)}</h2>`}const o=mtOpen['b'+i];
    h+=`<div class="card"><div class="row" style="cursor:pointer" onclick="mtToggleOpen('b${i}')"><div style="font-weight:700;flex:1">${esc(b.t)}</div><span class="muted">${o?'▾':'▸'}</span></div>
      ${o?`${b.w?`<div class="small" style="margin-top:6px">${esc(b.w)}</div>`:''}${b.h?`<ul class="book">${b.h.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${b.m?`<div class="small"><b>Mistakes:</b> ${esc(b.m)}</div>`:''}${b.d?`<div class="small" style="margin-top:4px;color:var(--gold)"><b>Solo drill:</b> ${esc(b.d)}</div>`:''}${b.f?`<div class="muted small" style="margin-top:4px">Watch: ${esc(b.f)}</div>`:''}`:''}</div>`});
  h+=`<h2>Gear the gym recommends</h2><div class="card small"><ul class="book"><li>Wraps: 180" Mexican-style (no gel or slip-on)</li><li>Bag gloves: Fairtex BGV9, 10–12 oz — lighter lets you drill at full speed</li><li>Sparring gloves: Twins 16 oz (never on the bag)</li><li>Shins: Windy or Fairtex, to the bottom of the kneecap</li><li>Steel Thai cup, SISU or Damage Control mouthguard, Venum elbow pads</li></ul></div>
  <h2>Strength the gym likes</h2><div class="card small"><ul class="book"><li>Kettlebell swings first (striking is ballistic), pull-ups next (clinch is a grind)</li><li>Simple &amp; Sinister: 100 one-hand swings &lt; 5 min + 10 get-ups &lt; 10 min</li><li>Start at 16 kg (~your 35 lb bell), work up to 24 kg. Your recomp lifting stays as is.</li></ul></div>
  <h2>Resources</h2><div class="card small"><ul class="book"><li>8limbs.us (Sylvie), Jack Slack, Lawrence Kenshin, Heatrick S&amp;C, Muay-Thai-Guy, Muay Thai Scholar, Striking Corner</li><li>Podcasts: Don Heatrick on Muay Thai Guy #69 · John Wayne Parr on JRE #616</li><li>YouTube knee fighters: Dieselnoi, Langsuan, Petchboonchu, Rajasak, Yodwicha</li><li>Instagram: @ambushcoach (class notes)</li></ul></div>`;
  return h}
function mtCharts(inMt){const days=Object.keys(S.mt).filter(isDate).sort();if(!days.length)return inMt?'<div class="card muted small">Charts appear once you log resting HR or a session.</div>':'';
  const rhr=days.filter(d=>S.mt[d].rhr).map(d=>({x:new Date(d+'T12:00:00').getTime(),y:S.mt[d].rhr}));
  const wk={};days.forEach(d=>{const w=mtWeek(d);if(w<1)return;const x=S.mt[d];wk[w]=wk[w]||{load:0,kicks:0,done:0};if(x.rpe!=null&&x.min)wk[w].load+=x.rpe*x.min;wk[w].kicks+=(x.kl||0)+(x.kr||0);if(x.done)wk[w].done++});
  const keys=Object.keys(wk).map(Number).sort((a,b)=>a-b);const bar=(f,c,u)=>{const mx=Math.max(1,...keys.map(k=>wk[k][f]));return keys.map(k=>`<div class="row small" style="margin:4px 0"><div style="width:54px" class="muted">Wk ${k}</div><div style="flex:1;background:#14171c;height:14px"><div style="width:${wk[k][f]/mx*100}%;background:${c};height:14px"></div></div><div style="width:64px;text-align:right">${wk[k][f]}${u}</div></div>`).join('')||'<div class="muted small">No sessions logged yet.</div>'};
  return `${inMt?'':'<h2>Muay Thai</h2>'}<div class="card"><div style="font-weight:700;margin-bottom:6px">Morning resting HR</div>${lineChart([{name:'Resting HR (bpm)',color:'#ff3b3b',pts:rhr}],{empty:'Log resting HR on the Muay Thai screen.'})}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:6px">Sessions done per week</div>${bar('done','var(--green)','/7')}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:6px">Weekly load (effort × minutes)</div>${bar('load','var(--blue)','')}</div>
    <div class="card"><div style="font-weight:700;margin-bottom:6px">Hard kicks per week (both legs)</div>${bar('kicks','#f5d33a','')}</div>`}

/* boot */
FD=null;
try{renderTabs();render();if(!$('view').innerText.includes('Screen error'))keepGoodCopy()}catch(e){console.error(e)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
